<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dicter une tâche ou un prêt</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2347">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --navy: #0F2347; --gold: #E3A72F; --text: #1F2937; --muted: #5A6880; --line: #DCE3EE; --bg: #F4F6FA; --ok: #1E8449; --ko: #C0392B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: 14px 18px 12px; border-bottom: 3px solid var(--gold); display: flex; align-items: center; gap: 10px; }
  header b { font-size: 17px; } header small { display: block; color: #AFC0DA; font-size: 12px; }
  header a { margin-left: auto; color: #AFC0DA; font-size: 13px; text-decoration: none; border: 1px solid #3A4D73; border-radius: 16px; padding: 4px 10px; }
  main { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
  .mic { align-self: center; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--navy); box-shadow: 0 0 0 5px var(--gold), 0 8px 24px rgba(15,35,71,.25); display: grid; place-items: center; margin: 10px 0 4px; cursor: pointer; }
  .mic.on { background: var(--ko); box-shadow: 0 0 0 5px #F5B7B1, 0 8px 24px rgba(192,57,43,.35); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .etat { text-align: center; color: var(--muted); font-size: 15px; min-height: 22px; }
  label { font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: -6px; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  textarea { min-height: 92px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 18px; padding: 6px 12px; }
  .chips button.on { border-color: var(--gold); background: #FFF8E8; font-weight: 700; }
  .btn { font: inherit; font-size: 18px; font-weight: 700; padding: 15px; border-radius: 12px; border: 2px solid var(--gold); background: var(--navy); color: #fff; width: 100%; }
  .btn:disabled { opacity: .55; }
  .ok { background: #E7F5EC; color: var(--ok); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
  .err { color: var(--ko); min-height: 18px; text-align: center; }
  .dern { font-size: 13.5px; color: var(--muted); }
  .dern div { padding: 6px 0; border-top: 1px solid var(--line); }
  .dern b { color: #1F4FA8; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #E4E9F2; border-radius: 12px; padding: 4px; }
  .modes button { font: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: var(--muted); }
  .modes button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .mat { display: flex; gap: 12px; align-items: center; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .mat input { width: 24px; height: 24px; flex-shrink: 0; accent-color: var(--navy); }
  #plist, #pcours { display: flex; flex-direction: column; gap: 8px; }
  .mat.sug { border-color: var(--gold); background: #FFFBF0; }
  .mat.pris { opacity: .55; }
  .mat .d { flex: 1; } .mat .d b { color: var(--navy); font-size: 16px; } .mat .d span { display: block; font-size: 13.5px; color: var(--muted); }
  .sec { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .ret { font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid var(--ok); color: var(--ok); background: #fff; border-radius: 9px; padding: 7px 10px; }
</style>
</head>
<body>
<header>
  <div><b>Dicter</b><small>Alternative Dentaire · Agence</small></div>
  <a href="../agence/">Mes tâches</a>
</header>
<main id="main"></main>
<script>
const EXEC = 'https://script.google.com/macros/s/AKfycbylyfquDSMq2V5u_fq6L0a8N-MNIRzZhmXa1vGSX_h-k6lBg0w4P-QcrAjZzz_y7pw2hQ/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
// Même connexion que l'appli AD Agence (même site : le code déjà saisi est réutilisé)
let TOKEN = ''; try { const k = JSON.parse(ls.get('ag_tok') || 'null'); if (k && Date.now() - k.ts < 5 * 3600000) TOKEN = k.t; } catch (e) {}
function donneesAgence() { try { for (const k of Object.keys(localStorage)) if (k.indexOf('ag_d_agence_') === 0) { const d = JSON.parse(localStorage.getItem(k)); if (d && d.moi) return d; } } catch (e) {} return null; }
const D = donneesAgence();
const MOI = D ? D.moi.prenom : 'Clément';
const EQUIPE = D && D.equipe ? D.equipe.map(e => e.prenom) : [MOI];
const CABS = D && D.cabinets ? D.cabinets.map(c => c.nom) : [];
async function post(body) { const r = await fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return r.json(); }
async function connecter(code) {
  const j = await post({ action: 'agence', op: 'login', code });
  if (!j.ok) { ls.del('ag_code'); return false; }
  TOKEN = j.token; ls.set('ag_code', code); ls.set('ag_tok', JSON.stringify({ t: j.token, ts: Date.now() })); return true;
}
async function api(op, data) {
  if (!TOKEN) { const c = ls.get('ag_code'); if (!c || !(await connecter(c))) throw new Error('code'); }
  let j = await post(Object.assign({ action: 'agence', token: TOKEN, op }, data));
  if (j.expire) { const c = ls.get('ag_code'); if (c && await connecter(c)) j = await post(Object.assign({ action: 'agence', token: TOKEN, op }, data)); else throw new Error('code'); }
  return j;
}
function ecranCode(msg) {
  $('main').innerHTML = '<p style="color:var(--muted)">Entrez votre code personnel de l\'Agence (une seule fois sur ce téléphone).</p>' +
    '<input id="cd" autocomplete="off" autocapitalize="characters" placeholder="Code personnel" style="text-transform:uppercase;letter-spacing:2px">' +
    '<p class="err" id="cdE">' + (msg || '') + '</p><button class="btn" id="cdB">Valider</button>';
  $('cdB').onclick = async () => { const c = $('cd').value.trim().toUpperCase().replace(/\s/g, ''); if (c.length < 6) { $('cdE').textContent = 'Code incomplet.'; return; } $('cdE').textContent = 'Connexion…'; if (await connecter(c)) ecranDictee(true); else $('cdE').textContent = 'Code incorrect.'; };
}

// ----- Découpage de la phrase dictée : cabinet, tâche, pour qui -----
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const maj = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function decouper(txt) {
  let t = String(txt || '').trim().replace(/\s+/g, ' '), pour = [];
  // « pour Bruno », « pour Séverine et Bruno »
  EQUIPE.forEach(p => { const re = new RegExp('\\b(pour|à|a)\\s+' + p.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/e/gi, '[eéèê]') + '\\b', 'i'); if (re.test(t.normalize('NFC'))) { pour.push(p); t = t.replace(re, '').trim(); } });
  t = t.replace(/\s+(et)\s*$/i, '').replace(/^[,;:.\s]+|[,;:\s]+$/g, '');
  let cab = '', reste = t;
  // 1) « Cabinet : tâche » ou « Cabinet, tâche » dicté avec une ponctuation
  const m1 = /^(.{2,50}?)\s*[:;]\s*(.+)$/.exec(t);
  // 2) Un cabinet connu au début de la phrase (le plus long qui correspond)
  const nt = norm(t); let best = '';
  CABS.forEach(c => { const nc = norm(c); if (nc.length >= 3 && (nt === nc || nt.indexOf(nc + ' ') === 0) && nc.length > norm(best).length) best = c; });
  if (best) { const mots = norm(best).split(' ').length; cab = best; reste = t.split(' ').slice(mots).join(' '); }
  else if (m1) { cab = m1[1].trim(); reste = m1[2].trim(); }
  else {
    // 3) « Docteur Dupont, … » / « Dr Dupont … » / « cabinet Machin … »
    const m3 = /^((?:docteur|dr\.?|cabinet|centre dentaire|chez(?: le)?(?: docteur| dr\.?)?)\s+[A-ZÀ-Ü][\wÀ-ÿ'-]*(?:\s+[A-ZÀ-Ü][\wÀ-ÿ'-]*)?)[\s,.-]+(.+)$/i.exec(t);
    if (m3) { cab = m3[1].replace(/^chez(?: le)?\s+/i, '').replace(/^docteur\s+/i, 'Dr ').replace(/^dr\.?\s+/i, 'Dr '); reste = m3[2]; }
  }
  reste = reste.replace(/^[,;:.\-\s]+/, '');
  return { cabinet: cab, titre: maj(reste || t), pour: pour.length ? pour : [MOI] };
}

// ----- Dictée -----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let reco = null, ecoute = false, texteBase = '';
function ecranDictee(auto) {
  $('main').innerHTML = '<div class="modes"><button id="mT" class="' + (MODE === 'tache' ? 'on' : '') + '">📝 Tâche</button><button id="mP" class="' + (MODE === 'pret' ? 'on' : '') + '">🔧 Prêt de matériel</button></div>' +
    '<button class="mic" id="mic" aria-label="Dicter"><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#E3A72F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>' +
    '<div class="etat" id="etat">' + (SR ? (MODE === 'pret' ? 'Dictez le cabinet et le matériel prêté' : 'Touchez le micro et dictez la tâche') : 'Dictez avec le micro du clavier') + '</div>' +
    (MODE === 'pret' ? zonePret() : '<label>Tâche</label><textarea id="tx" placeholder="Ex. : Dr Marty, changer le ressort du bras de la seringue"></textarea>' +
    '<label>Client / cabinet (vide = interne)</label><input id="cab" list="cabs" placeholder="Reconnu automatiquement">' +
    '<datalist id="cabs">' + CABS.slice(0, 4000).map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<label>Pour</label><div class="chips" id="pour">' + EQUIPE.map(p => '<button data-p="' + esc(p) + '" class="' + (p === MOI ? 'on' : '') + '">' + esc(p) + '</button>').join('') + '</div>' +
    '<p class="err" id="err"></p><button class="btn" id="go">Ajouter la tâche</button><div id="ok"></div><div class="dern" id="dern"></div>');
  $('mT').onclick = () => { MODE = 'tache'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  $('mP').onclick = () => { MODE = 'pret'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  $('mic').onclick = () => ecoute ? arreter() : demarrer();
  if (MODE === 'pret') { initPret(); if (auto && SR) demarrer(); return; }
  $('pour').onclick = e => { const b = e.target.closest('button'); if (b) b.classList.toggle('on'); };
  $('tx').oninput = () => appliquer(false);
  $('go').onclick = ajouter;
  derniers();
  if (auto && SR) demarrer(); else if (!SR) $('tx').focus();
}
let cabManuel = false;
function appliquer(depuisDictee) {
  const d = decouper($('tx').value);
  if (!cabManuel) $('cab').value = d.cabinet;
  if (depuisDictee || !cabManuel) document.querySelectorAll('#pour button').forEach(b => b.classList.toggle('on', d.pour.includes(b.dataset.p)));
}
function demarrer() {
  if (!SR) return;
  reco = new SR(); reco.lang = 'fr-FR'; reco.interimResults = true; reco.continuous = false; reco.maxAlternatives = 1;
  const champ = MODE === 'pret' ? 'ptx' : 'tx';
  texteBase = $(champ).value ? $(champ).value.trim() + ' ' : '';
  reco.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; $(champ).value = texteBase + s; if (MODE === 'pret') appliquerPret(); else appliquer(true); };
  reco.onerror = e => { $('etat').textContent = e.error === 'not-allowed' ? 'Micro refusé : autorisez-le dans les réglages du navigateur.' : e.error === 'no-speech' ? 'Rien entendu. Touchez le micro pour réessayer.' : 'Dictée interrompue. Touchez le micro.'; };
  reco.onend = () => { ecoute = false; $('mic').classList.remove('on'); if (($(MODE === 'pret' ? 'ptx' : 'tx').value || '').trim() && !/Micro refusé|Rien entendu|interrompue/.test($('etat').textContent)) $('etat').textContent = MODE === 'pret' ? 'Cochez le matériel prêté' : 'Vérifiez puis « Ajouter la tâche »'; };
  try { reco.start(); ecoute = true; $('mic').classList.add('on'); $('etat').textContent = 'Je vous écoute…'; } catch (e) {}
}
function arreter() { try { reco && reco.stop(); } catch (e) {} }
async function ajouter() {
  const d = decouper($('tx').value), cab = $('cab').value.trim(), titre = cab && !cabManuel && cab === d.cabinet ? d.titre : (cab && norm($('tx').value).indexOf(norm(cab)) === 0 ? d.titre : maj($('tx').value.trim()));
  const pour = [...document.querySelectorAll('#pour button.on')].map(b => b.dataset.p);
  if (titre.length < 3) { $('err').textContent = 'Dictez ou tapez la tâche.'; return; }
  if (!pour.length) { $('err').textContent = 'Choisissez au moins une personne.'; return; }
  arreter(); $('go').disabled = true; $('err').textContent = ''; $('go').textContent = 'Envoi…';
  try {
    const r = await api('tache_ajouter', { titre, cabinet: cab, pour });
    if (!r.ok) throw new Error(r.message || 'Erreur');
    const l = JSON.parse(ls.get('dict_dern') || '[]'); l.unshift({ n: r.n, c: cab, t: titre, p: pour.join(', '), d: new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) }); ls.set('dict_dern', JSON.stringify(l.slice(0, 8)));
    if (navigator.vibrate) navigator.vibrate(60);
    $('tx').value = ''; $('cab').value = ''; cabManuel = false; appliquer(false);
    $('ok').innerHTML = '<div class="ok">✓ ' + esc(r.n) + ' ajoutée' + (cab ? ' · ' + esc(cab) : '') + '</div>';
    $('etat').textContent = 'Touchez le micro pour une autre tâche'; derniers();
  } catch (e) {
    if (e.message === 'code') { ecranCode('Session expirée : entrez à nouveau votre code.'); return; }
    $('err').textContent = navigator.onLine === false ? 'Pas de réseau : réessayez dans un instant.' : 'Envoi impossible : ' + e.message;
  }
  $('go').disabled = false; $('go').textContent = 'Ajouter la tâche';
}
function derniers() {
  const l = JSON.parse(ls.get('dict_dern') || '[]');
  $('dern').innerHTML = l.length ? '<div style="border:0;font-weight:700;color:var(--navy)">Dernières tâches dictées</div>' + l.map(x => '<div>' + esc(x.d) + ' · ' + (x.c ? '<b>' + esc(x.c) + '</b> : ' : '') + esc(x.t) + (x.p !== MOI ? ' <i>(' + esc(x.p) + ')</i>' : '') + '</div>').join('') : '';
}
// ----- Prêt de matériel : « Thomasset, une turbine NSK et un détartreur » -----
let MODE = ls.get('dict_mode') === 'pret' ? 'pret' : 'tache', PRETS = null;
try { PRETS = JSON.parse(ls.get('dict_prets') || 'null'); } catch (e) {}
function zonePret() {
  return '<label>Ce que vous avez dicté</label><textarea id="ptx" style="min-height:64px" placeholder="Ex. : Dr Marty, une turbine NSK et un détartreur"></textarea>' +
    '<label>Cabinet / praticien</label><input id="pcab" list="cabs" placeholder="Reconnu automatiquement">' +
    '<datalist id="cabs">' + CABS.slice(0, 4000).map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<label>Retour prévu</label><div class="chips" id="pret_ret">' + [['', 'Pas de date'], ['7', '1 semaine'], ['14', '2 semaines'], ['30', '1 mois']].map((x, i) => '<button data-j="' + x[0] + '" class="' + (i === 0 ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
    '<div id="plist"><div class="etat">Chargement du parc de prêt…</div></div>' +
    '<p class="err" id="err"></p><button class="btn" id="pgo">Prêter le matériel coché</button><div id="ok"></div><div id="pcours"></div>' +
    '<details id="pajout" style="background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px"><summary style="font-weight:700;color:var(--navy)">+ Ajouter un matériel au parc de prêt</summary>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px"><label>Type</label><select id="aT" style="width:100%;font:inherit;font-size:17px;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff">' + ['Turbine', 'Contre-angle', 'Pièce à main', 'Micromoteur', 'Détartreur', 'Lampe à polymériser', 'Capteur radio', 'Radio rétro-alvéolaire', 'Autoclave', 'Thermosoudeuse', 'Compresseur', 'Aspiration', 'Fauteuil', 'Scialytique', 'PC / informatique', 'Autre'].map(t => '<option>' + t + '</option>').join('') + '</select>' +
    '<label>Marque</label><input id="aM" placeholder="Ex. : NSK"><label>Modèle</label><input id="aMo" placeholder="Ex. : Ti-Max Z900L"><label>N° de série</label><input id="aS" autocapitalize="characters">' +
    '<button class="btn" id="aGo" style="font-size:16px;padding:12px">Ajouter au parc</button></div></details>';
}
async function initPret() {
  $('ptx').oninput = appliquerPret; $('pcab').oninput = () => { cabManuel = !!$('pcab').value.trim(); listePret(); };
  $('pret_ret').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#pret_ret button').forEach(x => x.classList.toggle('on', x === b)); };
  $('pgo').onclick = preter;
  $('aGo').onclick = async () => {
    const v = id => $(id).value.trim();
    if (!v('aM') || !v('aS')) { $('err').textContent = 'Marque et n° de série obligatoires.'; return; }
    $('aGo').disabled = true; $('err').textContent = '';
    try { const r = await api('pret_materiel', { type: v('aT'), marque: v('aM'), modele: v('aMo'), serie: v('aS') }); if (!r.ok) throw new Error(r.message);
      $('ok').innerHTML = '<div class="ok">✓ ' + esc(v('aT') + ' ' + v('aM')) + ' ajouté au parc (' + esc(r.n) + ')</div>'; ['aM', 'aMo', 'aS'].forEach(id => $(id).value = '');
      const p = await api('prets'); if (p.ok) { PRETS = p; ls.set('dict_prets', JSON.stringify(p)); listePret(); } }
    catch (e) { $('err').textContent = e.message === 'code' ? 'Session expirée.' : e.message; }
    $('aGo').disabled = false;
  };
  if (PRETS) listePret();
  try { const r = await api('prets'); if (r.ok) { PRETS = r; ls.set('dict_prets', JSON.stringify(r)); listePret(); } else if (!PRETS) $('plist').innerHTML = '<p class="err">' + esc(r.message) + '</p>'; }
  catch (e) { if (e.message === 'code') ecranCode('Session expirée : entrez à nouveau votre code.'); else if (!PRETS) $('plist').innerHTML = '<p class="err">Parc de prêt indisponible (réseau).</p>'; }
}
const VIDES = 'un une le la les des de du d l et pour pret prete preter prets en avec au aux chez son sa ses on lui a il elle ce cette aussi plus deux trois'.split(' ');
const motsDe = s => norm(s).split(' ').filter(w => w.length > 1 && VIDES.indexOf(w) < 0).map(w => w.replace(/s$/, ''));
function scoreMat(m, mots) {
  const champ = motsDe([m.type, m.marque, m.modele, m.serie].join(' ')); let sc = 0;
  mots.forEach(w => { if (champ.some(c => c === w || (w.length >= 4 && (c.indexOf(w) === 0 || w.indexOf(c) === 0) && c.length >= 4))) sc++; });
  return sc;
}
function appliquerPret() {
  const d = decouper($('ptx').value);
  if (!cabManuel) $('pcab').value = d.cabinet;
  listePret();
}
function listePret() {
  if (!PRETS || !$('plist')) return;
  const coches = new Set([...document.querySelectorAll('#plist input:checked')].map(i => i.value));
  const txt = $('ptx').value, cab = $('pcab').value.trim(), d = decouper(txt);
  const mots = motsDe(cab && norm(txt).indexOf(norm(cab)) === 0 ? txt.slice(cab.length) : d.titre);
  const dispo = PRETS.materiels.filter(m => !m.pret && m.etat === 'Disponible').map(m => ({ m, sc: mots.length ? scoreMat(m, mots) : 0 }));
  dispo.sort((a, b) => b.sc - a.sc || (a.m.type + a.m.marque).localeCompare(b.m.type + b.m.marque, 'fr'));
  const sug = dispo.filter(x => x.sc > 0), autres = dispo.filter(x => !x.sc);
  const ligne = (x, s) => '<label class="mat' + (s ? ' sug' : '') + '"><input type="checkbox" value="' + esc(x.m.n) + '"' + (coches.has(x.m.n) ? ' checked' : '') + '><div class="d"><b>' + esc(x.m.type) + ' · ' + esc([x.m.marque, x.m.modele].filter(Boolean).join(' ')) + '</b><span>N° de série ' + esc(x.m.serie || '—') + (x.m.notes ? ' · ' + esc(x.m.notes) : '') + '</span></div></label>';
  let h = '';
  if (!PRETS.materiels.length) h = '<div class="etat">Le parc de prêt est vide : ajoutez le matériel dans l\'Agence, onglet Prêts.</div>';
  if (sug.length) h += '<div class="sec">Correspond à votre dictée</div>' + sug.map(x => ligne(x, true)).join('');
  if (autres.length) h += '<div class="sec">' + (sug.length ? 'Autre matériel disponible' : 'Matériel disponible') + '</div>' + autres.map(x => ligne(x, false)).join('');
  const sortis = PRETS.materiels.filter(m => m.pret);
  if (sortis.length) h += '<div class="sec">Déjà prêté</div>' + sortis.filter(m => !cab || norm(m.pret.cabinet) !== norm(cab)).map(m => '<div class="mat pris"><div class="d"><b>' + esc(m.type) + ' · ' + esc([m.marque, m.modele].filter(Boolean).join(' ')) + '</b><span>N° ' + esc(m.serie || '—') + ' · chez ' + esc(m.pret.cabinet) + ' depuis le ' + esc(m.pret.le) + '</span></div></div>').join('');
  $('plist').innerHTML = h;
  // Prêts en cours chez ce cabinet : bouton « Rendu »
  const chez = cab ? sortis.filter(m => norm(m.pret.cabinet) === norm(cab)) : [];
  $('pcours').innerHTML = chez.length ? '<div class="sec">En prêt chez ' + esc(cab) + '</div>' + chez.map(m => '<div class="mat"><div class="d"><b>' + esc(m.type) + ' · ' + esc([m.marque, m.modele].filter(Boolean).join(' ')) + '</b><span>N° ' + esc(m.serie || '—') + ' · prêté le ' + esc(m.pret.le) + (m.pret.retour ? ' · retour prévu ' + esc(m.pret.retour) : '') + '</span></div><button class="ret" data-n="' + esc(m.pret.n) + '">Rendu ✓</button></div>').join('') : '';
  document.querySelectorAll('#pcours .ret').forEach(b => b.onclick = () => rendre(b));
}
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
async function preter() {
  const ns = [...document.querySelectorAll('#plist input:checked')].map(i => i.value), cab = $('pcab').value.trim();
  if (cab.length < 3) { $('err').textContent = 'Indiquez le cabinet.'; return; }
  if (!ns.length) { $('err').textContent = 'Cochez le matériel prêté.'; return; }
  const j = (document.querySelector('#pret_ret button.on') || {}).dataset ? document.querySelector('#pret_ret button.on').dataset.j : '';
  const retour = j ? ymd(new Date(Date.now() + j * 86400000)) : '';
  const c = D && D.cabinets ? D.cabinets.find(x => norm(x.nom) === norm(cab)) : null;
  arreter(); $('pgo').disabled = true; $('err').textContent = ''; $('pgo').textContent = 'Envoi…';
  const faits = [], ko = [];
  for (const n of ns) {
    try { const r = await api('pret_sortir', { n, cabinet: cab, cabId: c ? c.id : '', praticien: cab, retour }); if (r.ok) faits.push(n); else ko.push(r.message); }
    catch (e) { if (e.message === 'code') { ecranCode('Session expirée : entrez à nouveau votre code.'); return; } ko.push('réseau'); }
  }
  const aujourdhui = new Date().toLocaleDateString('fr-FR');
  PRETS.materiels.forEach(m => { if (faits.includes(m.n)) m.pret = { n: '', cabinet: cab, praticien: cab, le: aujourdhui, retour: retour ? new Date(retour).toLocaleDateString('fr-FR') : '' }; });
  if (navigator.vibrate && faits.length) navigator.vibrate(60);
  $('ok').innerHTML = faits.length ? '<div class="ok">✓ ' + faits.length + ' matériel' + (faits.length > 1 ? 's' : '') + ' prêté' + (faits.length > 1 ? 's' : '') + ' à ' + esc(cab) + ' le ' + aujourdhui + '</div>' : '';
  $('err').textContent = ko.length ? 'Non enregistré : ' + ko.join(' · ') : '';
  $('pgo').disabled = false; $('pgo').textContent = 'Prêter le matériel coché';
  $('ptx').value = ''; listePret();
  try { const r = await api('prets'); if (r.ok) { PRETS = r; ls.set('dict_prets', JSON.stringify(r)); listePret(); } } catch (e) {}
}
async function rendre(b) {
  b.disabled = true; b.textContent = '…';
  try { const r = await api('pret_retour', { n: b.dataset.n }); if (!r.ok) throw new Error(r.message); }
  catch (e) { b.disabled = false; b.textContent = 'Rendu ✓'; $('err').textContent = e.message === 'code' ? 'Session expirée.' : 'Retour non enregistré : ' + e.message; return; }
  PRETS.materiels.forEach(m => { if (m.pret && m.pret.n === b.dataset.n) m.pret = null; });
  $('ok').innerHTML = '<div class="ok">✓ Retour enregistré</div>'; listePret();
  try { const r = await api('prets'); if (r.ok) { PRETS = r; ls.set('dict_prets', JSON.stringify(r)); listePret(); } } catch (e) {}
}
document.addEventListener('input', e => { if (e.target && e.target.id === 'cab') cabManuel = !!e.target.value.trim(); });
document.addEventListener('click', e => { if (e.target && (e.target.id === 'mT' || e.target.id === 'mP')) cabManuel = false; }, true);
if (!TOKEN && !ls.get('ag_code')) ecranCode(); else ecranDictee(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
