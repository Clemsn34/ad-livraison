<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dicter : tâche, prêt, fiche, panne, devis, instruments, pièces</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2347">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">

<style>
  :root { --navy: #0F2347; --gold: #E3A72F; --text: #1F2937; --muted: #5A6880; --line: #DCE3EE; --bg: #F4F6FA; --ok: #1E8449; --ko: #C0392B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: 14px 18px 12px; border-bottom: 3px solid var(--gold); display: flex; align-items: center; gap: 10px; }
  header b { font-size: 17px; } header small { display: block; color: #AFC0DA; font-size: 12px; }
  header a { margin-left: auto; color: #AFC0DA; font-size: 13px; text-decoration: none; border: 1px solid #3A4D73; border-radius: 16px; padding: 4px 10px; }
  main { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
  .mic { align-self: center; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--navy); box-shadow: 0 0 0 5px var(--gold), 0 8px 24px rgba(15,35,71,.25); display: grid; place-items: center; margin: 10px 0 4px; cursor: pointer; }
  .mic.on { background: var(--ko); box-shadow: 0 0 0 5px #F5B7B1, 0 8px 24px rgba(192,57,43,.35); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .etat { text-align: center; color: var(--muted); font-size: 15px; min-height: 22px; }
  label { font-size: 12.5px; font-weight: 700; color: var(--navy); margin-bottom: -6px; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  textarea { min-height: 92px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 18px; padding: 6px 12px; }
  .chips button.on { border-color: var(--gold); background: #FFF8E8; font-weight: 700; }
  .btn { font: inherit; font-size: 18px; font-weight: 700; padding: 15px; border-radius: 12px; border: 2px solid var(--gold); background: var(--navy); color: #fff; width: 100%; }
  .btn:disabled { opacity: .55; }
  .ok { background: #E7F5EC; color: var(--ok); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
  .err { color: var(--ko); min-height: 18px; text-align: center; }
  .dern { font-size: 13.5px; color: var(--muted); }
  .dern div { padding: 6px 0; border-top: 1px solid var(--line); }
  .dern b { color: #1F4FA8; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; background: #E4E9F2; border-radius: 12px; padding: 4px; }
  .modes button { font: inherit; font-size: 14.5px; font-weight: 700; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: var(--muted); }
  .modes.m5 { grid-template-columns: repeat(3, 1fr); }
  .modes.m5 button { padding: 10px 3px; font-size: 13.5px; hyphens: manual; }
  .modes .devis { grid-column: 1 / -1; justify-self: center; min-width: 40%; }
  .modes button.on { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .mat { display: flex; gap: 12px; align-items: center; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .mat input { width: 24px; height: 24px; flex-shrink: 0; accent-color: var(--navy); }
  #plist, #pcours { display: flex; flex-direction: column; gap: 8px; }
  .mat.sug { border-color: var(--gold); background: #FFFBF0; }
  .mat.pris { opacity: .55; }
  .mat .d { flex: 1; } .mat .d b { color: var(--navy); font-size: 16px; } .mat .d span { display: block; font-size: 13.5px; color: var(--muted); }
  .sec { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .ret { font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid var(--ok); color: var(--ok); background: #fff; border-radius: 9px; padding: 7px 10px; }
  .pj-salle { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .pj-salle h3 { margin: 0 0 6px; font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .pj-salle h3 button { margin-left: auto; font: inherit; font-size: 13px; border: 0; background: none; color: var(--ko); }
  .pj-eq { border-top: 1px solid var(--line); padding: 8px 0; }
  .pj-eq > label { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; color: var(--text); margin: 0; }
  .pj-eq > label input { width: 22px; height: 22px; accent-color: var(--navy); flex-shrink: 0; }
  .pj-det { margin: 8px 0 2px 32px; display: flex; flex-direction: column; gap: 6px; }
  .pj-det .chips button { padding: 5px 10px; font-size: 13.5px; }
  .pj-det input { font-size: 15px; padding: 8px 10px; }
  .pj-qte { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .pj-qte button { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-size: 18px; font-weight: 700; color: var(--navy); }
  .pj-opt { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; margin: 0; color: var(--text); }
  .pj-opt input { width: 20px; height: 20px; accent-color: var(--gold); }
  .cf-t { font-size: 12px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .cf-cat { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; background: #fff; }
  .cf-cat summary { font-weight: 700; color: var(--navy); cursor: pointer; }
  .cf-cat .pj-opt { padding: 5px 0; border-top: 1px solid #EEF2F7; }
  .cf-tot { background: #0F2347; color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 15px; text-align: right; }
  .cf-tot b { color: #E3A72F; }
  .chips button small { color: var(--muted); font-weight: 500; }
  .pj-add { display: flex; flex-wrap: wrap; gap: 6px; }
  .pj-add button { font: inherit; font-size: 14px; font-weight: 700; border: 1.5px dashed var(--navy); color: var(--navy); background: #fff; border-radius: 10px; padding: 8px 12px; }
  .pj-sw { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; margin: 0; color: var(--text); }
  .pj-sw input { width: 22px; height: 22px; accent-color: var(--navy); }
  .ibdg { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .ibdg.v { background: #E7F5EC; color: var(--ok); } .ibdg.r { background: #FDECEA; color: var(--ko); } .ibdg.o { background: #FFF4DC; color: #8A5A00; }
  .ifrise { display: flex; gap: 3px; } .ifr { flex: 1; font-size: 10.5px; text-align: center; background: #EEF2F7; color: var(--muted); border-radius: 6px; padding: 4px 2px; line-height: 1.2; }
  .ifr small { display: block; font-size: 10px; } .ifr.f { background: #DDEBFA; color: var(--navy); } .ifr.c { background: var(--navy); color: #fff; font-weight: 700; }
  .igar { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .isel { width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  #iZone { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<header>
  <div><b>Dicter</b><small>Alternative Dentaire · Agence</small></div>
  <a href="../agence/">Mes tâches</a>
</header>
<main id="main"></main>
<script>
const EXEC = 'https://script.google.com/macros/s/AKfycbylyfquDSMq2V5u_fq6L0a8N-MNIRzZhmXa1vGSX_h-k6lBg0w4P-QcrAjZzz_y7pw2hQ/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
// Même connexion que l'appli AD Agence (même site : le code déjà saisi est réutilisé)
let TOKEN = ''; try { const k = JSON.parse(ls.get('ag_tok') || 'null'); if (k && Date.now() - k.ts < 5 * 3600000) TOKEN = k.t; } catch (e) {}
function donneesAgence() { try { for (const k of Object.keys(localStorage)) if (k.indexOf('ag_d_agence_') === 0) { const d = JSON.parse(localStorage.getItem(k)); if (d && d.moi) return d; } } catch (e) {} return null; }
const D = donneesAgence();
const MOI = D ? D.moi.prenom : 'Clément';
const EQUIPE = D && D.equipe ? D.equipe.map(e => e.prenom) : [MOI];
// Onglet Devis réservé à Clément (gérant)
const DEVIS_OK = !D || !!D.voitTout || /^cl[ée]ment$/i.test(MOI);
const CABS = D && D.cabinets ? D.cabinets.map(c => c.nom) : [];
async function post(body) { const r = await fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return r.json(); }
async function connecter(code) {
  const j = await post({ action: 'agence', op: 'login', code });
  if (!j.ok) { ls.del('ag_code'); return false; }
  TOKEN = j.token; ls.set('ag_code', code); ls.set('ag_tok', JSON.stringify({ t: j.token, ts: Date.now() })); return true;
}
async function api(op, data) {
  if (!TOKEN) { const c = ls.get('ag_code'); if (!c || !(await connecter(c))) throw new Error('code'); }
  let j = await post(Object.assign({ action: 'agence', token: TOKEN, op }, data));
  if (j.expire) { const c = ls.get('ag_code'); if (c && await connecter(c)) j = await post(Object.assign({ action: 'agence', token: TOKEN, op }, data)); else throw new Error('code'); }
  return j;
}
function ecranCode(msg) {
  $('main').innerHTML = '<p style="color:var(--muted)">Entrez votre code personnel de l\'Agence (une seule fois sur ce téléphone).</p>' +
    '<input id="cd" autocomplete="off" autocapitalize="characters" placeholder="Code personnel" style="text-transform:uppercase;letter-spacing:2px">' +
    '<p class="err" id="cdE">' + (msg || '') + '</p><button class="btn" id="cdB">Valider</button>';
  $('cdB').onclick = async () => { const c = $('cd').value.trim().toUpperCase().replace(/\s/g, ''); if (c.length < 6) { $('cdE').textContent = 'Code incomplet.'; return; } $('cdE').textContent = 'Connexion…'; if (await connecter(c)) ecranDictee(false); else $('cdE').textContent = 'Code incorrect.'; };
}

// ----- Découpage de la phrase dictée : cabinet, tâche, pour qui -----
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const maj = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function decouper(txt) {
  let t = String(txt || '').trim().replace(/\s+/g, ' '), pour = [];
  // « pour Bruno », « pour Séverine et Bruno »
  EQUIPE.forEach(p => { const re = new RegExp('\\b(pour|à|a)\\s+' + p.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/e/gi, '[eéèê]') + '\\b', 'i'); if (re.test(t.normalize('NFC'))) { pour.push(p); t = t.replace(re, '').trim(); } });
  t = t.replace(/\s+(et)\s*$/i, '').replace(/^[,;:.\s]+|[,;:\s]+$/g, '');
  let cab = '', reste = t;
  // 1) « Cabinet : tâche » ou « Cabinet, tâche » dicté avec une ponctuation
  const m1 = /^(.{2,50}?)\s*[:;]\s*(.+)$/.exec(t);
  // 2) Un cabinet connu au début de la phrase (le plus long qui correspond)
  const nt = norm(t); let best = '';
  CABS.forEach(c => { const nc = norm(c); if (nc.length >= 3 && (nt === nc || nt.indexOf(nc + ' ') === 0) && nc.length > norm(best).length) best = c; });
  if (best) { const mots = norm(best).split(' ').length; cab = best; reste = t.split(' ').slice(mots).join(' '); }
  else if (m1) { cab = m1[1].trim(); reste = m1[2].trim(); }
  else {
    // 3) « Docteur Dupont, … » / « Dr Dupont … » / « cabinet Machin … »
    const m3 = /^((?:docteur|dr\.?|cabinet|centre dentaire|chez(?: le)?(?: docteur| dr\.?)?)\s+[A-ZÀ-Ü][\wÀ-ÿ'-]*(?:\s+[A-ZÀ-Ü][\wÀ-ÿ'-]*)?)[\s,.-]+(.+)$/i.exec(t);
    if (m3) { cab = m3[1].replace(/^chez(?: le)?\s+/i, '').replace(/^docteur\s+/i, 'Dr ').replace(/^dr\.?\s+/i, 'Dr '); reste = m3[2]; }
  }
  reste = reste.replace(/^[,;:.\-\s]+/, '');
  return { cabinet: cab, titre: maj(reste || t), pour: pour.length ? pour : [MOI] };
}

// ----- Dictée -----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let reco = null, ecoute = false, texteBase = '';
function ecranDictee(auto) {
  if (MODE === 'devis' && !DEVIS_OK) { MODE = 'tache'; ls.set('dict_mode', MODE); }
  $('main').innerHTML = '<div class="modes' + (D && D.estAD === false ? '' : ' m5') + '"><button id="mT" class="' + (MODE === 'tache' ? 'on' : '') + '">📝 Tâche</button><button id="mP" class="' + (MODE === 'pret' ? 'on' : '') + '">🔧 Prêt</button><button id="mF" class="' + (MODE === 'fiche' ? 'on' : '') + '">🔎 Fiche client</button>' + (D && D.estAD === false ? '' : '<button id="mD" class="' + (MODE === 'panne' ? 'on' : '') + '">🛠 Panne</button><button id="mI" class="' + (MODE === 'instr' ? 'on' : '') + '">🔩 Instru&shy;ments</button><button id="mR" class="' + (MODE === 'piece' ? 'on' : '') + '">⚙️ Pièces</button>' + (DEVIS_OK ? '<button id="mV" class="devis ' + (MODE === 'devis' ? 'on' : '') + '">📋 Devis</button>' : '')) + '</div>' +
    '<button class="mic" id="mic" aria-label="Dicter"><svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#E3A72F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>' +
    '<div class="etat" id="etat">' + (SR ? (MODE === 'pret' ? 'Dictez le cabinet et le matériel prêté' : MODE === 'devis' ? 'Le micro dicte la note du projet' : MODE === 'instr' ? 'Le micro dicte la panne de l\'instrument' : MODE === 'piece' ? 'Le micro dicte la nature de la panne' : MODE === 'panne' ? 'Dites la marque, le modèle et le code d\'erreur' : MODE === 'fiche' ? 'Dites le nom du cabinet' : 'Touchez le micro et dictez la tâche') : 'Dictez avec le micro du clavier') + '</div>' +
    (MODE === 'devis' ? '<div id="devis"></div>' : MODE === 'instr' ? zoneInstr() : MODE === 'piece' ? zonePiece() : MODE === 'panne' ? zonePanne() : MODE === 'fiche' ? zoneFiche() : MODE === 'pret' ? zonePret() : '<label>Tâche</label><textarea id="tx" placeholder="Ex. : Dr Marty, changer le ressort du bras de la seringue"></textarea>' +
    '<label>Client / cabinet (vide = interne)</label><input id="cab" list="cabs" placeholder="Reconnu automatiquement">' +
    '<datalist id="cabs">' + CABS.slice(0, 4000).map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<label>Pour</label><div class="chips" id="pour">' + EQUIPE.map(p => '<button data-p="' + esc(p) + '" class="' + (p === MOI ? 'on' : '') + '">' + esc(p) + '</button>').join('') + '</div>' +
    '<p class="err" id="err"></p><button class="btn" id="go">Ajouter la tâche</button><div id="ok"></div><div class="dern" id="dern"></div>');
  $('mT').onclick = () => { MODE = 'tache'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  $('mP').onclick = () => { MODE = 'pret'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  $('mF').onclick = () => { MODE = 'fiche'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  if ($('mV')) $('mV').onclick = () => { MODE = 'devis'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  if ($('mI')) $('mI').onclick = () => { MODE = 'instr'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  if ($('mR')) $('mR').onclick = () => { MODE = 'piece'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  if ($('mD')) $('mD').onclick = () => { MODE = 'panne'; ls.set('dict_mode', MODE); arreter(); ecranDictee(false); };
  $('mic').onclick = () => ecoute ? arreter() : demarrer();
  if (MODE === 'pret') { initPret(); if (PRE_CAB) { $('pcab').value = PRE_CAB; cabManuel = true; PRE_CAB = ''; listePret(); } return; }
  if (MODE === 'fiche') { initFiche(); return; }
  if (MODE === 'panne') { initPanne(); return; }
  if (MODE === 'devis') { initDevis(); return; }
  if (MODE === 'instr') { initInstr(); return; }
  if (MODE === 'piece') { initPiece(); return; }
  if (PRE_CAB) { setTimeout(() => { $('cab').value = PRE_CAB; cabManuel = true; PRE_CAB = ''; }, 0); }
  $('pour').onclick = e => { const b = e.target.closest('button'); if (b) b.classList.toggle('on'); };
  $('tx').oninput = () => appliquer(false);
  $('go').onclick = ajouter;
  derniers();
  if (!SR) $('tx').focus();
}
let cabManuel = false;
function appliquer(depuisDictee) {
  const d = decouper($('tx').value);
  if (!cabManuel) $('cab').value = d.cabinet;
  if (depuisDictee || !cabManuel) document.querySelectorAll('#pour button').forEach(b => b.classList.toggle('on', d.pour.includes(b.dataset.p)));
}
function demarrer() {
  if (!SR) return;
  if (MODE === 'piece' && !$('ppanne')) { document.querySelectorAll('#pVue button').forEach(x => x.classList.toggle('on', x.dataset.v === 'nouveau')); formPiece(); }
  if (MODE === 'instr' && !$('ipanne')) { document.querySelectorAll('#iVue button').forEach(x => x.classList.toggle('on', x.dataset.v === 'nouveau')); formInstr(); }
  reco = new SR(); reco.lang = 'fr-FR'; reco.interimResults = true; reco.continuous = false; reco.maxAlternatives = 1;
  const champ = MODE === 'piece' ? 'ppanne' : MODE === 'instr' ? 'ipanne' : MODE === 'pret' ? 'ptx' : MODE === 'fiche' ? 'ftx' : MODE === 'panne' ? 'dtx' : MODE === 'devis' ? 'jnote' : 'tx';
  texteBase = $(champ).value ? $(champ).value.trim() + ' ' : '';
  reco.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; $(champ).value = texteBase + s; if (MODE === 'pret') appliquerPret(); else if (MODE === 'instr' || MODE === 'piece') { /* panne enregistrée à la fin */ } else if (MODE === 'fiche' || MODE === 'panne') { /* recherche à la fin de la phrase */ } else if (MODE === 'devis') { PJ.note = $('jnote').value; sauverPJ(); } else appliquer(true); };
  reco.onerror = e => { $('etat').textContent = e.error === 'not-allowed' ? 'Micro refusé : autorisez-le dans les réglages du navigateur.' : e.error === 'no-speech' ? 'Rien entendu. Touchez le micro pour réessayer.' : 'Dictée interrompue. Touchez le micro.'; };
  reco.onend = () => { ecoute = false; if (MODE === 'devis') { $('mic').classList.remove('on'); $('etat').textContent = 'Note ajoutée'; return; } if (MODE === 'piece') { $('mic').classList.remove('on'); $('etat').textContent = 'Panne notée'; if (PF && $('ppanne')) { PF.panne = $('ppanne').value.trim(); ls.set('dict_pf', JSON.stringify(PF)); } return; } if (MODE === 'instr') { $('mic').classList.remove('on'); $('etat').textContent = 'Panne notée'; if (IF && $('ipanne')) { IF.panne = $('ipanne').value.trim(); ls.set('dict_if', JSON.stringify(IF)); } return; } if (MODE === 'panne' && $('dtx') && $('dtx').value.trim()) { $('mic').classList.remove('on'); chercherPanne(); return; } if (MODE === 'fiche' && $('ftx') && $('ftx').value.trim()) { $('mic').classList.remove('on'); chercherFiche(); return; } $('mic').classList.remove('on'); if (($(MODE === 'pret' ? 'ptx' : MODE === 'fiche' ? 'ftx' : 'tx').value || '').trim() && !/Micro refusé|Rien entendu|interrompue/.test($('etat').textContent)) $('etat').textContent = MODE === 'pret' ? 'Cochez le matériel prêté' : 'Vérifiez puis « Ajouter la tâche »'; };
  try { reco.start(); ecoute = true; $('mic').classList.add('on'); $('etat').textContent = 'Je vous écoute…'; } catch (e) {}
}
function arreter() { try { reco && reco.stop(); } catch (e) {} }
async function ajouter() {
