<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alternative Dentaire – Agence</title>
<style>
  :root { --navy: #0F2347; --gold: #E3A72F; --text: #1F2937; --muted: #5A6880; --line: #DCE3EE; --bg: #F4F6FA; --ok: #1E8449; --ko: #C0392B; }
  /*CHARTE*/
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); font-size: 14px; }
  header { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 3px solid var(--gold); }
  header img { width: 40px; height: 40px; background: #fff; border-radius: 50%; padding: 3px; }
  header .brand b { display: block; letter-spacing: 2px; font-size: 13px; color: var(--gold); }
  header .brand span { font-size: 18px; font-weight: 700; }
  header .moi { margin-left: auto; text-align: right; font-size: 13px; }
  header .moi small { display: block; color: #AFC0DA; }
  nav { display: flex; gap: 4px; padding: 10px 22px 0; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: 0; background: none; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--navy); border-bottom-color: var(--gold); }
  nav button .nb { background: var(--ko); color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 50px; }
  h2 { color: var(--navy); margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .sec { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .tache input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--navy); flex-shrink: 0; cursor: pointer; }
  .tache .t { flex: 1; }
  .tache .t b { color: var(--navy); }
  .tache .cli { font-size: 14.5px; font-weight: 700; color: #1F4FA8; line-height: 1.25; }
  .bdg.t { background: #EEF0FF; color: #3B3FA8; }
  .tache .tt { font-size: 14.5px; color: var(--text); margin-top: 2px; }
  .tache.fait .cli, .tache.fait .tt { text-decoration: line-through; color: var(--muted); }
  .sec.grp { font-size: 13px; color: var(--navy); border-bottom: 2px solid var(--gold); padding-bottom: 4px; margin-top: 22px; }
  .sec.grp em { font-style: normal; background: #EAF0FA; color: #1F4FA8; border-radius: 99px; padding: 1px 8px; margin-left: 4px; }
  .tache.fait .t b { text-decoration: line-through; color: var(--muted); }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bdg { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: #EAF0FA; color: var(--navy); margin-right: 4px; }
  .bdg.r { background: #FDECEA; color: var(--ko); } .bdg.v { background: #E7F5EC; color: var(--ok); } .bdg.o { background: #FFF4DC; color: #8A5A00; }
  .btn { background: var(--navy); color: #fff; border: 2px solid var(--gold); border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn-light { background: #fff; color: var(--navy); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: .6; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 9px; font: inherit; background: #fff; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .g3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .g2, .g3 { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label { margin: 0; font-weight: 600; color: var(--text); border: 1.5px solid var(--line); border-radius: 20px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chips input { width: auto; } .chips label:has(input:checked) { border-color: var(--gold); background: #FFF8E8; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar select { width: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th { background: #EEF2F8; color: var(--navy); text-align: left; padding: 7px 9px; font-size: 12px; white-space: nowrap; }
  td { padding: 7px 9px; border-top: 1px solid var(--line); vertical-align: top; }
  .tw { overflow-x: auto; margin-bottom: 14px; }
  .err { color: var(--ko); min-height: 18px; margin: 8px 0 0; }
  .prog { height: 6px; background: #EEF2F8; border-radius: 4px; overflow: hidden; margin-top: 6px; } .prog i { display: block; height: 100%; background: var(--gold); }
  .vide { color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 14px; }
  .aide p, .aide li { line-height: 1.55; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2347">
<link rel="icon" href="icone-192.png?v=2">
<link rel="apple-touch-icon" href="icone-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <div class="brand"><b>ALTERNATIVE DENTAIRE</b><span>Agence</span></div>
  <div class="moi" id="moi"></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="vide">Chargement…</div></main>
<script>
  const EXEC = 'https://script.google.com/macros/s/AKfycbylyfquDSMq2V5u_fq6L0a8N-MNIRzZhmXa1vGSX_h-k6lBg0w4P-QcrAjZzz_y7pw2hQ/exec'; let TOKEN = '';
  // Appli « AD Consommable » : mêmes données, sans installations ni SAV
  const APP = 'agence' === 'conso' ? 'conso' : 'agence';
  let D = null, onglet = 'taches', filtreTaches = 'moi', formInstall = false;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const jour = s => { const m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
  const auj = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
  let QUI = ''; try { QUI = localStorage.getItem('ag_qui') || ''; } catch (e) {}
  // Session gardée 5 h sur l'appareil (évite une connexion à chaque ouverture)
  if (!TOKEN || TOKEN.indexOf('{{') === 0) { TOKEN = ''; try { const k = JSON.parse(localStorage.getItem('ag_tok') || 'null'); if (k && Date.now() - k.ts < 5 * 3600000) TOKEN = k.t; } catch (e) {} }
  // Dernières données affichées tout de suite à l'ouverture, puis mises à jour en arrière-plan
  const cleCache = () => 'ag_d_' + APP + '_' + (QUI || '');
  function lireCache() { try { const c = JSON.parse(localStorage.getItem(cleCache()) || 'null'); return c && c.ok && c.moi ? c : null; } catch (e) { return null; } }
  function ecrireCache(d) { try { localStorage.setItem(cleCache(), JSON.stringify(d)); } catch (e) {} }
  function bandeauMaj(on) {
    let b = document.getElementById('majBand');
    if (!b) { b = document.createElement('div'); b.id = 'majBand'; b.style.cssText = 'position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.25)'; b.textContent = 'Mise à jour…'; document.body.appendChild(b); }
    b.style.display = on ? 'block' : 'none';
  }
  async function api(op, data) {
    const r = await fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'agence', token: TOKEN, op, qui: QUI }, data || {})) });
    const j = await r.json();
    if (j.expire) {
      let code = ''; try { code = localStorage.getItem('ag_code') || ''; } catch (e) {}
      if (code && !api.relance) { api.relance = true; const l = await connecter(code); api.relance = false; if (l) return api(op, data); }
      ecranCode(); throw new Error('expire');
    }
    return j;
  }
  // Connexion par code personnel (quand le compte Google du téléphone n'est pas celui de l'agence)
  async function connecter(code) {
    const r = await fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'agence', op: 'login', code }) });
    const j = await r.json();
    if (!j.ok) { try { localStorage.removeItem('ag_code'); } catch (e) {} return false; }
    TOKEN = j.token; try { localStorage.setItem('ag_code', code); localStorage.setItem('ag_tok', JSON.stringify({ t: j.token, ts: Date.now() })); } catch (e) {} return true;
  }
  function ecranCode(msg) {
    document.getElementById('nav').innerHTML = ''; document.getElementById('moi').innerHTML = '';
    document.getElementById('main').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><h2>Connexion</h2><p class="sub">Entrez votre code personnel (donné par Clément). Il sera retenu sur cet appareil.<br>Sur l\'ordinateur du bureau, la connexion avec le compte @alternativedentaire.fr se fait toute seule.</p>' +
      '<input id="cdIn" autocomplete="off" autocapitalize="characters" placeholder="Code personnel" style="font-size:18px;letter-spacing:2px;text-transform:uppercase" onkeydown="if(event.key===\'Enter\')essaiCode(this)">' +
      '<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto" onchange="document.getElementById(\'cdIn\').type=this.checked?\'text\':\'password\'" checked> Afficher le code</label>' +
      '<p class="err" id="cdErr">' + (msg || '') + '</p><button class="btn" style="width:100%" onclick="essaiCode(document.getElementById(\'cdIn\'))">Se connecter</button></div>';
  }
  async function essaiCode(inp) {
    const c = String(inp.value || '').trim().toUpperCase().replace(/\s/g, '');
    if (c.length < 6) { document.getElementById('cdErr').textContent = 'Code incomplet.'; return; }
    document.getElementById('cdErr').textContent = 'Connexion…';
    if (await connecter(c)) charger(); else document.getElementById('cdErr').textContent = 'Code incorrect.';
  }
  async function charger() {
    // Les dernières données s'affichent tout de suite, avant même la connexion au serveur
    const c = lireCache(), dejaAffiche = !!c && !D;
    if (dejaAffiche) { D = c; try { afficher(); } catch (e) {} bandeauMaj(true); }
    if (!TOKEN) {
      let code = ''; try { code = localStorage.getItem('ag_code') || ''; } catch (e) {}
      if (!code || !(await connecter(code))) { bandeauMaj(false); ecranCode(); return; }
    }
    let N;
    // La liste des cabinets (plus de 3 000) n'est renvoyée que si elle a changé
    try { N = await api('init', { cabV: c && c.cabV && c.cabinets ? c.cabV : '' }); } catch (e) { bandeauMaj(false); return; }
    bandeauMaj(false);
    if (!N.ok) { if (!dejaAffiche) document.getElementById('main').innerHTML = '<div class="vide">' + esc(N.message) + '</div>'; return; }
    if (!N.cabinets && c && c.cabinets) N.cabinets = c.cabinets;
    D = N; ecrireCache(N);
    if (D.partage && D.partage.indexOf(QUI) < 0) { choisirQui(); return; }
    // Ne pas effacer une saisie en cours : on rafraîchit seulement si rien n'est en train d'être tapé
    const a = document.activeElement;
    if (dejaAffiche && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    afficher();
  }
  // Compte partagé (ex. : consommable@) : chacun choisit son prénom une fois sur son ordinateur
  function choisirQui() {
    document.getElementById('nav').innerHTML = '';
    document.getElementById('main').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><h2>Qui êtes-vous ?</h2><p class="sub">Ce compte est partagé. Choisissez votre prénom : il sera retenu sur cet ordinateur.</p>' +
      D.partage.map(p => '<button class="btn" style="margin:6px" onclick="choisir(\'' + esc(p) + '\')">' + esc(p) + '</button>').join('') + '</div>';
  }
  function choisir(p) { QUI = p; try { localStorage.setItem('ag_qui', p); } catch (e) {} charger(); }
  function changerQui() { try { localStorage.removeItem('ag_qui'); } catch (e) {} QUI = ''; charger(); }
  const pourDe = t => String(t.pour || '').split(/\s*[,;]\s*/).filter(Boolean);
  function mesTaches() { return D.taches.filter(t => pourDe(t).includes(D.moi.prenom)); }
  let attribuant = '';
  function chipsPour(nom, choisis) { return '<div class="chips">' + D.equipe.map(e => '<label><input type="checkbox" name="' + nom + '" value="' + esc(e.prenom) + '"' + (choisis.includes(e.prenom) ? ' checked' : '') + '>' + esc(e.prenom) + '</label>').join('') + '</div>'; }
  const cochés = nom => [...document.querySelectorAll('input[name=' + nom + ']:checked')].map(i => i.value);
  async function attribuer(b, n) {
    const l = cochés('at_' + n); if (!l.length) { alert('Choisissez au moins une personne.'); return; }
    b.disabled = true; const r = await api('tache_attribuer', { n, pour: l });
    if (!r.ok) { b.disabled = false; alert(r.message); return; }
    const t = D.taches.find(x => x.n === n); if (t) t.pour = r.pour; attribuant = ''; afficher();
  }
  function afficher() {
    document.getElementById('moi').innerHTML = esc(D.moi.prenom + ' ' + D.moi.nom) + '<small>' + esc(D.moi.poste || D.moi.role) + ' · ' + esc(D.moi.societe) +
      (D.partage ? ' · <a href="#" onclick="changerQui();return false" style="color:inherit">changer</a>' : '') + '</small>';
    const retard = mesTaches().filter(t => t.statut !== 'Fait' && jour(t.echeance) && jour(t.echeance) <= auj).length;
    let tabs = [['taches', 'Mes tâches', retard]].concat(D.estAD ? [['clients', 'Clients'], ['installs', 'Installations']] : [], D.prets ? [['prets', 'Prêts'], ['atelier', 'Atelier']] : [], D.devis ? [['devis', 'Devis entretien']] : [], D.publier !== false ? [['publier', 'Publier']] : [], D.revisions ? [['revs', 'Révisions']] : [], D.conso ? [['conso', 'Consommables']] : [],
      D.estAD ? [['demandes', 'Demandes des cabinets'], ['doctech', 'Doc technique']] : [], D.prospects ? [['prospects', 'Prospects']] : [], [['docs', 'Documents'], ['aide', 'Mode d\'emploi']]);
    // Le gérant voit tout, dans les deux applis
    if (D.voitTout) { /* tous les onglets */ }
    else if (APP === 'conso') tabs = [['taches', 'Mes tâches', retard], ['clients', 'Clients']].concat(D.publier !== false ? [['publier', 'Publier']] : [], [['conso', 'Consommables'], ['demandes', 'Demandes des cabinets']], D.prospects ? [['prospects', 'Prospects']] : [], [['docs', 'Documents'], ['aide', 'Mode d\'emploi']]);
    else if (D.estAD) tabs = tabs.filter(t => t[0] !== 'conso');
    if (!tabs.some(t => t[0] === onglet)) onglet = 'taches';
    document.getElementById('nav').innerHTML = tabs.map(t => '<button class="' + (onglet === t[0] ? 'on' : '') + '" onclick="aller(\'' + t[0] + '\')">' + t[1] + (t[2] ? '<span class="nb">' + t[2] + '</span>' : '') + '</button>').join('');
    ({ taches: vueTaches, clients: vueClients, installs: vueInstalls, conso: vueConso, demandes: vueDemandes, orga: vueOrga, docs: vueDocs, revs: vueRevs, chantiers: vueChantiers, devis: vueDevis, prets: vuePrets, atelier: vueAtelier, publier: vuePublier, aide: vueAide, doctech: vueDocTech, prospects: vueProspects })[onglet]();
  }
  function aller(o) { onglet = o; PD = []; facVue = false; afficher(); }

  // ---------------- Tâches ----------------
  function vueTaches() {
    const liste = filtreTaches === 'moi' ? mesTaches() : filtreTaches === 'tous' ? D.taches : D.taches.filter(t => pourDe(t).includes(filtreTaches));
    let h = '<h2>' + (filtreTaches === 'moi' ? 'Mes tâches' : 'Tâches') + '</h2><p class="sub">Cochez une tâche quand elle est faite. Seules les tâches liées à une installation ont une date.</p>' +
      '<div class="toolbar"><select onchange="filtreTaches=this.value;afficher()"><option value="moi">Mes tâches</option><option value="tous"' + (filtreTaches === 'tous' ? ' selected' : '') + '>Toute l\'équipe</option>' +
      D.equipe.filter(e => e.prenom !== D.moi.prenom).map(e => '<option value="' + esc(e.prenom) + '"' + (filtreTaches === e.prenom ? ' selected' : '') + '>' + esc(e.prenom) + ' (' + esc(e.role) + ')</option>').join('') + '</select>' +
      '<button class="btn-light" onclick="document.getElementById(\'nt\').style.display=\'block\'">+ Nouvelle tâche</button></div>' +
      '<div class="card" id="nt" style="display:none"><div class="g2"><div><label>Client / cabinet (vide = tâche interne)</label><input id="ntC" list="cabs" placeholder="Ex. : Dr Marty"></div><div><label>Tâche</label><input id="ntT" placeholder="Ex. : rappeler le Dr Martin pour le devis"></div>' +
      '</div>' +
      '<label>Pour (une ou plusieurs personnes : la première qui la fait la coche)</label>' + chipsPour('ntP', [D.moi.prenom]) +
      '<div class="g3"><div><label>Techniciens à prévoir</label><select id="ntN">' + optTechs('') + '</select></div><div><label>Temps à prévoir</label><select id="ntDu">' + optDuree('') + '</select></div><div><label>Pièces</label><select id="ntPc"><option value="">Pas de pièce</option><option>À commander</option><option>Commandée</option></select></div></div><label>Détail (facultatif)</label><input id="ntD">' +
      '<p class="err" id="ntErr"></p><button class="btn" onclick="ajouterTache(this)">Ajouter</button></div>' + datalistCabs();
    const cli = t => { if (t.cabinet) return { c: t.cabinet, t: t.titre }; const m = /^([^:]{2,60})\s*:\s*(.+)$/.exec(t.titre || ''); return m ? { c: m[1].trim(), t: m[2].trim().charAt(0).toUpperCase() + m[2].trim().slice(1) } : (t.install ? { c: 'Installation ' + t.install, t: t.titre } : null); };
    const ordre = (a, b) => (jour(a.echeance) || 9e15) - (jour(b.echeance) || 9e15);
    const carte = t => {
      const k = cli(t), fait = t.statut === 'Fait', j = jour(t.echeance);
      const bd = fait ? '' : !j ? '' : j < auj ? '<span class="bdg r">En retard · ' + esc(t.echeance) + '</span>' : +j === +auj ? '<span class="bdg o">Aujourd\'hui</span>' : '<span class="bdg">' + esc(t.echeance) + '</span>';
      return '<div class="card tache' + (fait ? ' fait' : '') + '"><div class="row" style="align-items:flex-start">' +
        '<input type="checkbox"' + (fait ? ' checked' : '') + ' onchange="cocher(\'' + esc(t.n) + '\', this.checked)" style="margin-top:3px">' +
        '<div class="t"><div' + (fait || infosEdit === t.n ? '' : ' style="cursor:pointer" title="Toucher pour modifier" onclick="infosEdit=\'' + esc(t.n) + '\';afficher()"') + '>' + (k ? '<div class="cli">' + esc(k.c) + '</div><div class="tt">' + esc(k.t) + '</div>' : '<div class="tt">' + esc(t.titre) + '</div>') + '</div>' +
        (t.pieces ? '<div style="margin-top:4px"><button class="bdg ' + (t.pieces === 'À commander' ? 'r' : t.pieces === 'Commandée' ? 'o' : 'v') + '" style="border:0;cursor:pointer;font:inherit;font-size:12px" title="Passer à l\'étape suivante" onclick="piecesSuivant(\'' + esc(t.n) + '\')">🔩 Pièces : ' + esc(t.pieces) + (t.pieces === 'Reçue – RDV à prendre' ? '' : ' ›') + '</button></div>' : '') +
        (t.techs || t.duree ? '<div style="margin-top:4px">' + (t.techs ? '<span class="bdg t">👷 ' + esc(t.techs) + ' technicien' + (t.techs > 1 ? 's' : '') + '</span>' : '') + (t.duree ? '<span class="bdg t">⏱ ' + esc(t.duree) + '</span>' : '') + '</div>' : '') +
        '<div class="meta">' + bd + (t.install && t.cabinet ? 'Installation ' + esc(t.install) + ' · ' : '') + (filtreTaches !== 'moi' || pourDe(t).length > 1 ? 'pour ' + esc(t.pour) : '') + (fait ? ' · fait par ' + esc(t.faitPar) + ' le ' + esc(t.faitLe) : '') + '</div>' +
        (t.detail ? '<div class="meta">' + esc(t.detail) + '</div>' : '') +
        (infosEdit === t.n ? '<div style="margin-top:8px"><div class="g2"><div><label>Client / cabinet (vide = interne)</label><input id="ie_c" list="cabs" value="' + esc(k && t.cabinet ? t.cabinet : (k && !t.install ? k.c : '')) + '"></div><div><label>Tâche</label><textarea id="ie_t" rows="2">' + esc(t.cabinet || !k || t.install ? t.titre : k.t) + '</textarea></div></div>' +

      [/scanner|empreinte|cfao|fraiseuse|imprimante 3d/i, 'Scanner intra-oral / CFAO'], [/autoclave|thermo|stérilis|sterilis|soudeuse|déminéral|deminéral|lavage/i, 'Stérilisation (autoclave, thermodésinfecteur)'],
      [/compresseur|aspiration|séparateur|amalgame/i, 'Compresseur / aspiration'], [/turbine|contre-angle|micromoteur|moteur|pièce à main|détartreur|detartreur/i, 'Instruments rotatifs (turbine, contre-angle, moteur)'],
      [/selle|tabouret|meuble|mobilier|colonne|chariot|placard/i, 'Mobilier'], [/ordinateur|écran|ecran|pc\b|serveur|logiciel/i, 'Informatique']];
    const out = [], vus = {};
    debuts.forEach((d, i) => {
      let seg = t.slice(d.p, i + 1 < debuts.length ? debuts[i + 1].p : t.length);
      seg = seg.replace(/Description Qté PU TTC[\s\S]*?(Facture N° FA\d+[^\n]*\n)/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
      if (/^(Remise|Total|Mode de règlement)/i.test(seg)) return;
      const serials = [...seg.matchAll(/N\s*[°º]\s*(?!de\b)(?:\d{1,3}(?: \d{3})*,\d{2}\s+){0,2}([@A-Za-z0-9][A-Za-z0-9@\-\/\.]{3,}(?:\s\d{2}(?=\s|$))?)/g)].filter(x => !/^(contrat|de)$/i.test(x[1]));
      const serie = serials.length ? serials[0][1].replace(/[.,]$/, '') : '';
      const fin = seg.search(/\s(N\s*[°º]|Couleur|couleur\s|Cart\b|composé|Durée de garantie|\d{1,3}(?: \d{3})*,\d{2}\s|\(|Lumière|Capteur filaire|Traçabilité|Commandé par|Nouveau modèle)/);
      let design = (fin > 0 ? seg.slice(0, fin) : seg.slice(0, 90)).replace(/\s+\d+,\d{2}$/, '').trim();
      if (design.length > 110) design = design.slice(0, 110).replace(/\s\S*$/, '') + '…';
      const coul = (seg.match(/couleur\s*:?\s*((?:(?!N\s*[°º]|Cart\b|Tablette|Base\b|Lumière|Durée|Montée|Sans\b)[^\s])+(?:\s+(?:(?!N\s*[°º]|Cart\b|Tablette|Base\b|Lumière|Durée|Montée|Sans\b|OFFERT)[^\s]+)){0,3})/i) || [])[1] || '';
      const gar = (seg.match(/Durée de garantie\s*:\s*(\d+)\s*mois/i) || [])[1] || '';
      const compo = serials.slice(1).map(x => { const av = seg.slice(Math.max(0, x.index - 60), x.index).split(/\s-\s|composé de :/).pop().trim(); return (av ? av + ' ' : '') + 'N° ' + x[1]; }).join(' ; ');
      const offert = /\bOFFERT\b|offerte?\b/i.test(seg) && !serie;
      let cat = 'Autre'; for (const [re, c] of CAT) if (re.test(design)) { cat = c; break; }
      if (offert && (cat !== 'Mobilier' || /sellerie|option|bouteille|housse/i.test(design))) return;
      design = design.replace(/\s*OFFERTE?\b/gi, '');
      if (!serie && cat === 'Autre') return;
      if (/^(option|bouteille)/i.test(design.replace(d.marque, '').trim())) return;
      const k = (serie || (design + salleA(d.p))).toUpperCase(); if (vus[k]) return; vus[k] = 1;
      out.push({ marque: d.marque, designation: design, serie, couleur: coul.trim(), salle: salleA(d.p), categorie: cat, garantie: gar, composants: compo });
    });
    return out;
  }

  let PDFJS = null;
  async function pdfJs() {
    if (PDFJS) return PDFJS;
    await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = ok; sc.onerror = () => ko(new Error('Lecteur PDF indisponible (connexion).')); document.head.appendChild(sc); });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return (PDFJS = window.pdfjsLib);
  }
  // Texte d'un PDF, ligne par ligne (dans l'ordre de lecture)
  async function textePdf(base64) {
    const lib = await pdfJs(), bin = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const doc = await lib.getDocument({ data: bin }).promise; let out = '';
    for (let p = 1; p <= doc.numPages; p++) {
      const items = (await (await doc.getPage(p)).getTextContent()).items.filter(i => i.str.trim());
      const lignes = [];
      items.forEach(i => { const y = Math.round(i.transform[5]); let l = lignes.find(x => Math.abs(x.y - y) <= 3); if (!l) { l = { y, it: [] }; lignes.push(l); } l.it.push(i); });
      lignes.sort((a, b) => b.y - a.y).forEach((l, k, a) => { if (k && a[k - 1].y - l.y > 18) out += '\n'; out += l.it.sort((x, y) => x.transform[4] - y.transform[4]).map(i => i.str).join(' ') + '\n'; });
      out += '\n';
    }
    return out;
  }

    etat.textContent = 'Lecture de ' + r.fichiers.length + ' document(s)…';
    const lettres = an.code.replace(/\d.*$/, ''), num = String(+an.code.replace(/^[A-Z]*/, '').replace(/[A-Z]$/, ''));
    // Code sans lettre (« erreur 12 ») : exiger un mot d'erreur devant, sinon tous les numéros de page sortiraient
    const motif = lettres ? new RegExp('(^|[^A-Z0-9])' + lettres + '\\s?[-.]?\\s?0*' + num + '(?![0-9])', 'i')
      : new RegExp('(err(?:or|eur)?|code|alarme?|d[ée]faut|fault|message|E|n°)\\s?[-.:]?\\s?0*' + num + '(?![0-9])', 'i');
    let trouve = 0;
    for (const f of r.fichiers) {
      let pdf; try { pdf = await api('doc_fichier', { id: f.id }); } catch (e) { continue; }
      if (!pdf.ok || !/pdf/.test(pdf.type || '')) continue;
      try {
        const lib = await pdfJs(), bin = Uint8Array.from(atob(pdf.base64), c => c.charCodeAt(0)), doc = await lib.getDocument({ data: bin.slice() }).promise;
        const pages = [];
        for (let p = 1; p <= doc.numPages && pages.length < 4; p++) {
          const txt = (await (await doc.getPage(p)).getTextContent()).items.map(i => i.str).join(' ').replace(/\s+/g, ' ');
          const mm = motif.exec(txt);
          if (mm) { const d = Math.max(0, mm.index - 120); pages.push({ p, extrait: txt.slice(d, mm.index + 480) }); }
        }
        if (!pages.length) continue;
        trouve++; DOCPDF[f.id] = doc;
        const url = URL.createObjectURL(new Blob([bin], { type: 'application/pdf' }));
        res.innerHTML += '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"><b>📕 ' + esc(f.nom) + '</b><div class="meta">' + esc(f.chemin) + '</div>' +
          pages.map(x => '<div style="margin-top:6px;padding:8px;background:#FFF8E6;border-radius:8px;font-size:14px;line-height:1.45">' + esc(x.extrait).replace(motif, m0 => '<mark>' + m0 + '</mark>') +
            '<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn-light" onclick="docVoirPage(this,\'' + esc(f.id) + '\',' + x.p + ')">Voir la page ' + x.p + '</button><a class="btn-light" style="text-decoration:none" target="_blank" href="' + url + '#page=' + x.p + '">Ouvrir le PDF à la page ' + x.p + '</a></div><div class="pg"></div></div>').join('') + '</div>';
      } catch (e) {}
    }
    etat.textContent = trouve ? 'Le code apparaît dans ' + trouve + ' document(s) :' : 'Code trouvé par Google Drive mais illisible dans ces PDF (scan) : ouvrez-les ci-dessous.';
    if (!trouve) res.innerHTML = r.fichiers.map(f => '<div class="row" style="margin-top:6px"><div style="flex:1">📕 ' + esc(f.nom) + '</div><button class="btn-light" onclick="docFichier(this,\'' + esc(f.id) + '\')">Ouvrir</button></div>').join('');
  }

        (prof < 5 ? niveau(liste.filter(x => x !== e), e.prenom, prof + 1) : '')).join('');
    };
    let h = '<h2>Organigramme</h2><p class="sub">Qui fait quoi dans chaque société. Pour ajouter ou modifier une personne : onglet « Équipe agence » du tableau (société, responsable, poste, compte Google).</p>';
    Object.keys(parSoc).sort((a, b) => (a !== 'Alternative Dentaire') - (b !== 'Alternative Dentaire') || a.localeCompare(b)).forEach(s => {
      h += '<div class="sec">' + esc(s) + ' · ' + parSoc[s].length + ' personne(s)</div>' + niveau(parSoc[s], '', 0);
    });
    document.getElementById('main').innerHTML = h;
  }

  // ---------------- Mode d'emploi ----------------

      '<p><b>Rendez-vous</b> : sur une tâche, ⏱ indique le nombre de techniciens et le temps à prévoir pour l\'intervention (visible par la secrétaire et Bruno pour caler le rendez-vous). 👥 l\'attribue à une ou plusieurs personnes.</p>' +

      '<p><b>Devis entretien</b> : choisissez le cabinet, cochez ses appareils et les quantités, puis envoyez. Le praticien reçoit le devis PDF (prix TTC par mois) dans Mon Cabinet AD, rubrique « Mes documents », avec une notification. Le devis est aussi noté dans l\'onglet « Devis entretien » du tableau.</p>' +

      '<p style="color:var(--muted)">Les modèles de tâches (quoi, pour quel rôle, combien de jours avant ou après l\'installation) se modifient dans l\'onglet « Modèles de tâches » du tableau. L\'accès à cette page se gère dans l\'onglet « Équipe agence ».</p></div>';

  charger().catch(e => { if (e.message !== 'expire') document.getElementById('main').innerHTML = '<div class="vide">Connexion impossible. Rechargez la page.</div>'; });
