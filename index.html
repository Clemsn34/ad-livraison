<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AD Livraison">
<meta charset="utf-8">
<meta name="theme-color" content="#1A1A1A">
<title>AD Préparation &amp; Livraison</title>
<style>
  :root {
    --rose: #B92C79; --rose-f: #8E1F5C; --rose-c: #F6E3EE; --noir: #1A1A1A; --anthracite: #2E2E30;
    --gris: #6B6B73; --gris-c: #F4F4F7; --bord: #E2E2E8; --vert: #1E9E5A; --vert-c: #E4F5EB;
    --orange: #E08E1B; --orange-c: #FDF1DF; --rouge: #D64545; --rouge-c: #FBE6E6; --blanc: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--gris-c); color: var(--noir);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 10; background: var(--noir); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-left: 8px solid var(--rose);
    display: flex; align-items: center; gap: 12px; }
  header .titre { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 17px; color: var(--rose); letter-spacing: .3px; }
  header .sous { font-size: 12px; color: #C9C9D1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: #3A3A3D; color: #fff; border: 0; border-radius: 12px; padding: 9px 12px; font-size: 14px; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .carte { background: var(--blanc); border: 1px solid var(--bord); border-radius: 18px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 2px 0 rgba(0,0,0,.03); }
  .btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 16px; font-size: 17px;
    font-weight: 700; color: #fff; background: var(--rose); margin: 8px 0; cursor: pointer; }
  .btn:active { transform: translateY(1px); filter: brightness(.92); }
  .btn.second { background: #E7E7EC; color: var(--noir); }
  .btn.noir { background: var(--anthracite); }
  .btn.vert { background: var(--vert); }
  .btn[disabled] { opacity: .45; }
  .rangee { display: flex; gap: 10px; }
  .rangee .btn { margin: 0; }
  input[type=text], input[type=password], input[type=search], textarea {
    width: 100%; border: 2px solid var(--bord); border-radius: 14px; padding: 14px; font-size: 17px;
    background: #fff; outline: none; font-family: inherit; }
  input:focus, textarea:focus { border-color: var(--rose); }
  label.lab { display: block; font-size: 13px; font-weight: 700; color: var(--rose-f); margin: 6px 0; text-transform: uppercase; letter-spacing: .4px; }
  .onglets { display: flex; background: #E7E7EC; border-radius: 16px; padding: 4px; margin-bottom: 14px; }
  .onglets button { flex: 1; border: 0; background: transparent; padding: 11px 2px; border-radius: 12px; font-size: 13px !important;
    font-size: 14px; font-weight: 700; color: var(--gris); }
  .onglets button.actif { background: var(--rose); color: #fff; }
  .onglets .nb { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px;
    background: rgba(0,0,0,.12); font-size: 12px; margin-left: 4px; }
  .cmd { display: flex; align-items: center; gap: 12px; }
  .cmd .num { width: 52px; height: 52px; border-radius: 16px; background: var(--rose-c); color: var(--rose-f);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex: none; }
  .cmd .info { flex: 1; min-width: 0; }
  .cmd .prat { font-weight: 800; font-size: 17px; }
  .cmd .meta { color: var(--gris); font-size: 13px; margin-top: 2px; }
  .pastille { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .p-prep { background: var(--orange-c); color: #9A5C06; }
  .p-pret { background: var(--rose-c); color: var(--rose-f); }
  .p-livre { background: var(--vert-c); color: #157A45; }
  .vide { text-align: center; color: var(--gris); padding: 40px 10px; }
  .vide .gros { font-size: 44px; }
  .progression { background: #fff; border: 1px solid var(--bord); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .progression .haut { display: flex; justify-content: space-between; align-items: baseline; }
  .progression .grand { font-size: 26px; font-weight: 800; }
  .barre { height: 12px; background: #E7E7EC; border-radius: 8px; overflow: hidden; margin-top: 10px; }
  .barre div { height: 100%; background: var(--rose); border-radius: 8px; transition: width .25s; }
  .barre.ok div { background: var(--vert); }
  .scan { display: flex; gap: 8px; margin-bottom: 12px; }
  .scan input { flex: 1; }
  .scan button { flex: none; border: 0; border-radius: 14px; background: var(--anthracite); color: #fff;
    font-size: 22px; width: 60px; }
  .ligne { background: #fff; border: 2px solid var(--bord); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px;
    transition: background .3s, border-color .3s; }
  .ligne.complete { border-color: var(--vert); background: var(--vert-c); }
  .ligne.trop { border-color: var(--orange); background: var(--orange-c); }
  .ligne.flash { background: #CFF2DD; }
  .ligne .lib { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .ligne .ref { color: var(--gris); font-size: 12px; margin-top: 3px; }
  .ligne .bas { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .ligne .compte { flex: 1; font-size: 22px; font-weight: 800; }
  .ligne .compte small { font-size: 14px; color: var(--gris); font-weight: 600; }
  .ligne .bas button { width: 48px; height: 48px; border-radius: 14px; border: 0; background: #E7E7EC;
    font-size: 24px; font-weight: 800; color: var(--noir); }
  .ligne .bas button.tout { width: auto; padding: 0 14px; font-size: 14px; background: var(--rose-c); color: var(--rose-f); }
  .ligne .prep { font-size: 12px; color: var(--gris); margin-top: 4px; }
  .haut-ligne { display: flex; gap: 10px; align-items: flex-start; }
  .signaler { display: block; width: 100%; margin-top: 10px; border: 0; background: var(--orange-c); color: #8A5205;
    border-radius: 14px; padding: 11px; font-size: 14px; font-weight: 700; }
  .signale { margin-top: 10px; background: var(--orange); color: #fff; border-radius: 14px; padding: 9px 12px;
    font-size: 14px; font-weight: 700; text-align: center; }
  .haut-ligne .lib { flex: 1; }
  .empl { flex: none; background: var(--noir); color: #fff; border-radius: 12px; padding: 6px 10px; font-weight: 800;
    font-size: 17px; letter-spacing: .5px; cursor: pointer; }
  .empl.vide-empl { background: #fff; color: var(--rose-f); border: 2px dashed var(--rose); font-size: 12px;
    letter-spacing: 0; padding: 5px 8px; order: 2; }
  .ligne .gerer { color: var(--rose-f); font-weight: 700; text-decoration: underline; cursor: pointer; }
  .code-ligne { display: flex; align-items: center; gap: 10px; border: 2px solid var(--bord); border-radius: 14px;
    padding: 10px 12px; margin: 8px 0; }
  .code-ligne .num { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; }
  .code-ligne .src { font-size: 12px; color: var(--gris); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 500; }
  .code-ligne button { border: 0; border-radius: 12px; background: var(--rouge-c); color: var(--rouge);
    font-weight: 700; padding: 10px 12px; font-size: 14px; }
  .ligne .apprendre { display: block; width: 100%; margin-top: 10px; border: 2px dashed var(--rose); background: #fff;
    color: var(--rose-f); border-radius: 14px; padding: 11px; font-size: 14px; font-weight: 700; }
  #bandeau-apprendre { position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 30;
    margin: 0 16px; background: var(--rose); color: #fff; border-radius: 16px; padding: 12px 14px; display: none;
    font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #bandeau-apprendre button { background: rgba(255,255,255,.22); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 10px; font-weight: 700; margin-left: 6px; }
  .barre-bas { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96);
    border-top: 1px solid var(--bord); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 20; }
  .barre-bas .btn { max-width: 608px; margin: 0 auto; }
  #toast { position: fixed; left: 16px; right: 16px; top: calc(76px + env(safe-area-inset-top)); z-index: 50;
    border-radius: 16px; padding: 14px 16px; font-weight: 700; color: #fff; display: none; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .modale { position: fixed; inset: 0; background: rgba(26,26,26,.6); z-index: 60; display: none;
    align-items: flex-end; justify-content: center; }
  .modale .boite { background: #fff; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; }
  .modale h2 { margin: 4px 0 10px; font-size: 19px; }
  .choix { display: block; width: 100%; text-align: left; border: 2px solid var(--bord); background: #fff;
    border-radius: 14px; padding: 12px; margin: 8px 0; font-size: 15px; }
  #video-zone { position: fixed; inset: 0; background: #000; z-index: 70; display: none; }
  #video-zone video { width: 100%; height: 100%; object-fit: cover; }
  #video-zone .viseur { position: absolute; left: 10%; right: 10%; top: 38%; height: 24%;
    border: 4px solid var(--rose); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
  #video-zone .bas { position: absolute; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); }
  #video-zone .aide { position: absolute; top: calc(24px + env(safe-area-inset-top)); left: 16px; right: 16px;
    color: #fff; text-align: center; font-weight: 700; }
  canvas#signature { width: 100%; height: 210px; border: 2px dashed var(--rose); border-radius: 16px; background: #fff;
    touch-action: none; display: block; }
  .apercu { width: 100%; border-radius: 14px; margin-top: 8px; display: none; }
  .ecart { background: var(--orange-c); color: #7A4A05; border-radius: 14px; padding: 12px; font-size: 14px; margin: 8px 0; }
  .attente { position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 80; display: none;
    align-items: center; justify-content: center; flex-direction: column; font-weight: 700; color: var(--rose-f); }
  .roue { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--rose-c); border-top-color: var(--rose);
    animation: tourne 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .logo-connexion { text-align: center; margin: 30px 0 22px; }
  .logo-connexion .marque { font-size: 26px; font-weight: 900; color: var(--rose); }
  .logo-connexion .sous { color: var(--gris); font-size: 14px; margin-top: 4px; }
  .etapes { display: flex; gap: 6px; margin: 0 0 14px; }
  .etapes div { flex: 1; text-align: center; font-size: 12px; font-weight: 700; color: var(--gris); }
  .etapes div span { display: block; height: 6px; border-radius: 4px; background: #DADADF; margin-bottom: 6px; }
  .etapes div.fait span { background: var(--vert); }
  .etapes div.encours span { background: var(--rose); }
  .etapes div.encours { color: var(--rose-f); }
</style>
</head>
<body>
<header>
  <div class="titre">
    <h1>ALTERNATIVE DENTAIRE</h1>
    <div class="sous" id="sous-titre">Préparation &amp; livraison</div>
  </div>
  <button id="btn-retour" style="display:none" onclick="retour()">‹ Retour</button>
  <button id="btn-quitter" style="display:none" onclick="deconnexion()">⎋</button>
</header>
<div id="toast"></div>
<main id="ecran"></main>
<div class="barre-bas" id="barre-bas" style="display:none"></div>

<div class="modale" id="modale"><div class="boite" id="modale-boite"></div></div>
<div id="video-zone">
  <video id="video" playsinline muted></video>
  <div class="aide">Placez le code-barres dans le cadre rose</div>
  <div class="viseur"></div>
  <div class="bas"><button class="btn second" onclick="arreterCamera()">Fermer la caméra</button></div>
</div>
<div id="bandeau-apprendre"><div id="bandeau-apprendre-texte"></div>
  <div style="margin-top:8px;text-align:right"><button onclick="ouvrirCamera()">📷 Caméra</button>
  <button onclick="annulerApprendre()">Annuler</button></div></div>
<div class="attente" id="attente"><div class="roue"></div><div id="attente-texte">Un instant…</div></div>
<input type="file" id="photo-code" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photo-colis" accept="image/*" capture="environment" style="display:none">

<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
// ======================================================================
// État
// ======================================================================
var S = { code: '', nom: '', liste: [], onglet: 'prep', cmd: null, mode: '', q: {}, photo: '', ecran: 'connexion' };

function lire(cle, defaut) { try { var v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } }
function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
function effacer(cle) { try { localStorage.removeItem(cle); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }

// Adresse du service Google (utilisée quand la page est hébergée hors de Google, ex. GitHub Pages)
var API_URL = 'https://script.google.com/macros/s/AKfycbx5HO3kQI28Vk0Dh6Lcv7RdemekJSznX9T7lEBaAxyndu9JK3wq2SOTo1DE40Lc3HSrJg/exec';
function appel(fonction) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (window.google && google.script && google.script.run) {   // page ouverte depuis Google
    return new Promise(function (ok, ko) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { ko(e && e.message ? e.message : String(e)); });
      r[fonction].apply(r, args);
    });
  }
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fonction, args: args }), redirect: 'follow' })
    .then(function (rep) { return rep.json(); })
    .catch(function () { throw 'Pas de connexion Internet (ou service Google indisponible).'; })
    .then(function (r) { if (!r.ok) throw (r.message || 'Erreur du service.'); return r.data; });
}
function attente(oui, texte) { $('attente').style.display = oui ? 'flex' : 'none'; $('attente-texte').textContent = texte || 'Un instant…'; }
var toastMinuteur = null;
function toast(texte, couleur) {
  var t = $('toast'); t.textContent = texte; t.style.background = couleur || 'var(--anthracite)'; t.style.display = 'block';
  clearTimeout(toastMinuteur); toastMinuteur = setTimeout(function () { t.style.display = 'none'; }, 2600);
}
var audio = null;
function bip(bon) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = bon ? 1250 : 320; o.type = 'sine'; g.gain.value = 0.18;
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (bon ? 0.12 : 0.35));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(bon ? 60 : [120, 80, 120]);
}

// ======================================================================
// Connexion
// ======================================================================
function ecranConnexion(message) {
  S.ecran = 'connexion';
  entete('Préparation & livraison', false);
  $('barre-bas').style.display = 'none';
  $('ecran').innerHTML =
    '<div class="logo-connexion"><div class="marque">Préparation & livraison</div>' +
    '<div class="sous">Commandes consommables · Alternative Dentaire</div></div>' +
    '<div class="carte"><label class="lab">Votre code d\'accès</label>' +
    '<input type="password" id="code" autocomplete="current-password" placeholder="Le même que dans le logiciel">' +
    '<label style="display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--gris)">' +
    '<input type="checkbox" id="voir-code" style="width:22px;height:22px;accent-color:var(--rose)" ' +
    'onchange="$(\'code\').type=this.checked?\'text\':\'password\'"> 👁 Afficher le code</label>' +
    (message ? '<div class="ecart" style="margin-top:10px">' + esc(message) + '</div>' : '') +
    '<button class="btn" onclick="connexion()">Se connecter</button></div>' +
    '<p style="text-align:center;color:var(--gris);font-size:13px">Astuce : ajoutez cette page à l\'écran d\'accueil du téléphone.</p>';
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') connexion(); });
}
function connexion() {
  var code = $('code').value.trim();
  if (code.length < 6) { toast('Le code fait au moins 6 caractères', 'var(--rouge)'); return; }
  attente(true, 'Connexion…');
  appel('mobConnexion', code).then(function (r) {
    S.code = code; S.nom = r.nom; ecrire('ad_code', code); ecrire('ad_nom', r.nom);
    attente(false); chargerListe();
  }).catch(function (e) { attente(false); ecranConnexion(e); });
}
function deconnexion() { effacer('ad_code'); S.code = ''; ecranConnexion(); }
function entete(sous, retourVisible) {
  $('sous-titre').textContent = sous;
  $('btn-retour').style.display = retourVisible ? 'block' : 'none';
  $('btn-quitter').style.display = (!retourVisible && S.code) ? 'block' : 'none';
}

// ======================================================================
// Liste des commandes
// ======================================================================
function chargerListe() {
  attente(true, 'Chargement des commandes…');
  appel('mobListe', S.code).then(function (l) { S.liste = l; attente(false); ecranListe(); })
    .catch(function (e) { attente(false); if (/code|accès/i.test(e)) ecranConnexion(e); else toast(e, 'var(--rouge)'); });
}
function ecranListe() {
  S.ecran = 'liste'; S.cmd = null;
  entete('Bonjour ' + (S.nom || '').split(' ')[0] + ' 👋', false);
  var groupes = { prep: [], livr: [], fait: [], article: [] };
  S.liste.forEach(function (c) {
    if (c.statut === 'À préparer') groupes.prep.push(c);
    else if (c.statut === 'Prête à livrer') groupes.livr.push(c);
    else groupes.fait.push(c);
  });
  var onglet = function (cle, texte) {
    return '<button class="' + (S.onglet === cle ? 'actif' : '') + '" onclick="S.onglet=\'' + cle + '\';ecranListe()">' +
      texte + '<span class="nb">' + groupes[cle].length + '</span></button>';
  };
  if (S.onglet === 'article') { ecranArticle(groupes, onglet); return; }
  var h = '<div class="onglets">' + onglet('prep', '📦 Préparer') + onglet('livr', '🚐 Livrer') + onglet('fait', '✅ Livrées') +
    '<button onclick="S.onglet=\'article\';ecranListe()">🔎 Article</button></div>';
  var l = groupes[S.onglet];
  if (!l.length) {
    h += '<div class="vide"><div class="gros">' + ({ prep: '📦', livr: '🚐', fait: '✅' })[S.onglet] + '</div>' +
      ({ prep: 'Aucune commande à préparer.', livr: 'Aucune commande à livrer.', fait: 'Aucune livraison ces 7 derniers jours.' })[S.onglet] + '</div>';
  }
  l.forEach(function (c) {
    var past = c.statut === 'À préparer' ? '<span class="pastille p-prep">À préparer</span>'
      : c.statut === 'Prête à livrer' ? '<span class="pastille p-pret">Prête · ' + esc(c.preparee_par) + '</span>'
      : '<span class="pastille p-livre">Livrée ' + esc(c.livree_le) + '</span>';
    h += '<div class="carte cmd" onclick="ouvrir(\'' + esc(c.id) + '\')"><div class="num">N°' + esc(c.id) + '</div>' +
      '<div class="info"><div class="prat">' + esc(c.praticien) + '</div><div class="meta">' + c.lignes + ' article' +
      (c.lignes > 1 ? 's' : '') + ' · envoyée ' + esc(c.envoyee) + '</div><div style="margin-top:6px">' + past + '</div></div>' +
      '<div style="font-size:24px;color:var(--rose)">›</div></div>';
  });
  $('ecran').innerHTML = h;
  barreBas('<button class="btn second" onclick="chargerListe()">🔄 Actualiser</button>');
}
function barreBas(html) { var b = $('barre-bas'); b.innerHTML = html; b.style.display = html ? 'block' : 'none'; }

// ======================================================================
// Une commande : préparation ou livraison
// ======================================================================
function ouvrir(id) {
  attente(true, 'Ouverture de la commande…');
  appel('mobDetail', S.code, id).then(function (d) {
    attente(false);
    S.cmd = d;
    S.mode = d.statut === 'À préparer' ? 'prep' : (d.statut === 'Prête à livrer' ? 'livr' : 'vue');
    var sauve = lire('ad_q_' + d.id + '_' + S.mode, null);
    S.q = {};
    d.lignes.forEach(function (l) {
      S.q[l.ligne] = sauve && sauve[l.ligne] != null ? sauve[l.ligne]
        : (S.mode === 'vue' ? (l.qte_livree || 0) : 0);
    });
    ecranCommande();
  }).catch(function (e) { attente(false); toast(e, 'var(--rouge)'); });
}
function cibleLigne(l) { return S.mode === 'livr' && l.qte_preparee != null ? l.qte_preparee : l.qte; }
function ecranCommande() {
  S.ecran = 'commande';

  var h = '<div class="etapes">' +
    '<div class="' + (S.mode === 'prep' ? 'encours' : 'fait') + '"><span></span>Préparer</div>' +
    '<div class="' + (S.mode === 'livr' ? 'encours' : (S.mode === 'vue' ? 'fait' : '')) + '"><span></span>Vérifier chez le client</div>' +
    '<div class="' + (S.mode === 'vue' ? 'fait' : '') + '"><span></span>Signature</div></div>';
  h += '<div class="progression" id="progression"></div>';
  if (S.mode !== 'vue') {
    h += '<div class="scan"><input type="search" id="saisie-scan" inputmode="text" autocomplete="off" ' +
      'placeholder="Scanner ou taper un code" enterkeyhint="go"><button onclick="ouvrirCamera()" aria-label="Caméra">📷</button></div>';
  }

  h += '<div id="lignes"></div>';

  dessinerLignes();
  if (S.mode !== 'vue') {
    var champ = $('saisie-scan');
    champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); scanne(champ.value); champ.value = ''; } });
    barreBas('<button class="btn ' + (S.mode === 'prep' ? '' : 'vert') + '" onclick="terminer()">' +
      (S.mode === 'prep' ? '✅ Préparation terminée' : '✍️ Faire signer le praticien') + '</button>');
  } else {
    barreBas('');
  }
}
function dessinerLignes(flashLigne) {
  var d = S.cmd, total = 0, fait = 0, lignesOk = 0;
  var h = '';
  // au stockage : dans l'ordre des emplacements (rangée puis hauteur), les articles sans emplacement à la fin
  var ordre = d.lignes.slice();
  if (S.mode === 'prep') ordre.sort(function (a, b) { return cleEmpl(a.emplacement) < cleEmpl(b.emplacement) ? -1 : (cleEmpl(a.emplacement) > cleEmpl(b.emplacement) ? 1 : a.ligne - b.ligne); });
  ordre.forEach(function (l) {
    var cible = cibleLigne(l), q = S.q[l.ligne] || 0;
    total += cible; fait += Math.min(q, cible);
    var etat = q === cible ? 'complete' : (q > cible ? 'trop' : '');
    if (q === cible) lignesOk++;
    h += '<div class="ligne ' + etat + (flashLigne === l.ligne ? ' flash' : '') + '" id="l' + l.ligne + '">' +
      '<div class="haut-ligne">' + (l.emplacement ?
        '<span class="empl" onclick="saisirEmplacement(' + l.ligne + ')">📍 ' + esc(l.emplacement) + '</span>' :
        (S.mode !== 'vue' ? '<span class="empl vide-empl" onclick="saisirEmplacement(' + l.ligne + ')">📍 Ajouter l\'emplacement</span>' : '')) +
      '<div class="lib">' + esc(l.libelle) + '</div></div><div class="ref">Réf. ' + esc(l.code) +
      (l.eans.length ? ' · ' + l.eans.length + ' code-barres connu' + (l.eans.length > 1 ? 's' : '') : ' · pas de code-barres : cocher à la main') +
      (S.mode !== 'vue' && l.eans.length ? ' · <a class="gerer" onclick="gererCodes(' + l.ligne + ')">✏️ modifier</a>' : '') + '</div>' +
      (S.mode === 'livr' && l.qte_preparee != null && l.qte_preparee !== l.qte ?
        '<div class="prep">⚠ Commandé ' + l.qte + ', préparé ' + l.qte_preparee + '</div>' : '') +
      '<div class="bas"><div class="compte">' + q + ' <small>/ ' + cible + (q === cible ? ' ✓' : (q > cible ? ' trop' : '')) + '</small></div>' +
      (S.mode !== 'vue' ? '<button onclick="ajuster(' + l.ligne + ',-1)">−</button><button onclick="ajuster(' + l.ligne + ',1)">+</button>' +
        (q !== cible ? '<button class="tout" onclick="toutLigne(' + l.ligne + ')">Tout ✓</button>' : '') : '') +
      '</div>' +
      (S.mode === 'prep' ? (l.signale ? '<div class="signale">⚠ Signalé : à recommander</div>' :
        '<button class="signaler" onclick="signalerLigne(' + l.ligne + ')">⚠ Il n\'en reste presque plus : à recommander</button>') : '') +
      (S.mode !== 'vue' && !l.eans.length ? '<button class="apprendre" onclick="apprendreLigne(' + l.ligne + ')">' +
        '📷 Scanner le code-barres de cette boîte pour l\'enregistrer</button>' : '') +
      '</div>';
  });
  $('lignes').innerHTML = h;
  var pct = total ? Math.round(fait / total * 100) : 0;
  $('progression').innerHTML = '<div class="haut"><div><div class="grand">' + fait + ' / ' + total + '</div>' +
    '<div style="color:var(--gris);font-size:13px">articles · ' + lignesOk + '/' + d.lignes.length + ' lignes complètes</div></div>' +
    '<div style="font-size:30px">' + (pct === 100 ? '🎉' : '') + '</div></div>' +
    '<div class="barre ' + (pct === 100 ? 'ok' : '') + '"><div style="width:' + pct + '%"></div></div>';
  if (S.mode !== 'vue') ecrire('ad_q_' + d.id + '_' + S.mode, S.q);
  if (flashLigne) {
    var el = $('l' + flashLigne);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function () { if (el) el.classList.remove('flash'); }, 600);
  }
}
function ajuster(n, delta) { S.q[n] = Math.max(0, (S.q[n] || 0) + delta); dessinerLignes(); }
function toutLigne(n) {
  var l = S.cmd.lignes.filter(function (x) { return x.ligne === n; })[0];
  S.q[n] = cibleLigne(l); dessinerLignes();
}

// ---------- reconnaissance d'un code scanné ou tapé ----------
function normaliser(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g, ''); }
function chiffres(s) { var c = String(s || '').replace(/\D/g, ''); return c.replace(/^0+/, ''); }
function correspond(l, brut) {
  var n = normaliser(brut), c = chiffres(brut);
  if (!n) return false;
  if (normaliser(l.code) === n) return true;
  for (var i = 0; i < l.eans.length; i++) {
    if (normaliser(l.eans[i]) === n) return true;
    if (c.length >= 8 && chiffres(l.eans[i]) === c) return true;
  }
  for (var j = 0; j < l.refs.length; j++) if (normaliser(l.refs[j]) === n) return true;
  // code GS1 long (étiquettes avec lot / péremption) : le GTIN suit « 01 »
  var m = n.match(/^\(?01\)?(\d{14})/);
  if (m) { var g = chiffres(m[1]); for (var k = 0; k < l.eans.length; k++) if (chiffres(l.eans[k]) === g) return true; }
  return false;
}
function apprendreLigne(n) {
  var l = S.cmd.lignes.filter(function (x) { return x.ligne === n; })[0];
  S.apprendre = n;
  $('bandeau-apprendre-texte').textContent = 'Scannez le code-barres de : ' + l.libelle.slice(0, 60);
  $('bandeau-apprendre').style.display = 'block';
  var c = $('saisie-scan'); if (c) c.focus();
  ouvrirCamera();
}
function annulerApprendre() { S.apprendre = null; $('bandeau-apprendre').style.display = 'none'; }
function scanne(brut) {
  brut = String(brut || '').trim();
  if (S.ecran === 'article') { chercherArticle(brut); return; }
  if (!brut || !S.cmd) return;
  if (S.apprendre) {
    var deja = S.cmd.lignes.filter(function (l) { return l.ligne !== S.apprendre && correspond(l, brut); })[0];
    var n = S.apprendre;
    if (deja && (deja.appris || []).indexOf(brut) < 0) {   // code de la fiche d'un autre article : on ne touche pas
      bip(false); toast('Ce code-barres est celui de la fiche : ' + deja.libelle.slice(0, 40), 'var(--orange)'); return;
    }
    annulerApprendre(); arreterCamera();
    if (deja) {   // code scanné par erreur sur un autre article de la commande : on propose de le déplacer
      S.deplacement = { de: deja.ligne, vers: n, code: brut };
      modale('<h2>Code déjà utilisé</h2><p style="margin-top:0">Ce code-barres avait été enregistré pour :<br><b>' +
        esc(deja.libelle) + '</b></p><p>Le rattacher plutôt à :<br><b>' + esc(ligneN(n).libelle) + '</b> ?</p>' +
        '<button class="btn" onclick="confirmerDeplacement()">Oui, corriger</button>' +
        '<button class="btn second" onclick="fermerModale()">Non</button>');
      return;
    }
    associer(n, brut);
    return;
  }
  var candidates = S.cmd.lignes.filter(function (l) { return correspond(l, brut); });
  if (!candidates.length) { bip(false); inconnu(brut); return; }
  var l = candidates.filter(function (x) { return (S.q[x.ligne] || 0) < cibleLigne(x); })[0] || candidates[0];
  S.q[l.ligne] = (S.q[l.ligne] || 0) + 1;
  var q = S.q[l.ligne], cible = cibleLigne(l);
  if (q > cible) { bip(false); toast('⚠ Trop : ' + q + ' / ' + cible + ' — ' + l.libelle.slice(0, 40), 'var(--orange)'); }
  else { bip(true); toast((q === cible ? '✓ Ligne complète : ' : '+1 · ') + l.libelle.slice(0, 44), 'var(--vert)'); }
  dessinerLignes(l.ligne);
}
function inconnu(brut) {
  arreterCamera();
  var restantes = S.cmd.lignes.filter(function (l) { return (S.q[l.ligne] || 0) < cibleLigne(l); });
  // d'abord les articles qui n'ont encore aucun code-barres : c'est sûrement l'un d'eux
  restantes.sort(function (a, b) { return (a.eans.length ? 1 : 0) - (b.eans.length ? 1 : 0); });
  var h = '<h2>Code inconnu</h2><p style="color:var(--gris);margin-top:0">« ' + esc(brut) + ' » ne correspond à aucun article de la commande. ' +
    'Si c\'est bien un produit de la liste, touchez-le : le code sera retenu pour la prochaine fois.</p>';
  restantes.forEach(function (l) {
    h += '<button class="choix" onclick="associer(' + l.ligne + ',\'' + esc(brut).replace(/'/g, '') + '\')"><b>' + esc(l.libelle) +
      '</b><br><span style="color:var(--gris);font-size:13px">' + (S.q[l.ligne] || 0) + ' / ' + cibleLigne(l) +
      (l.eans.length ? '' : ' · <b style="color:var(--rose-f)">pas encore de code-barres</b>') + '</span></button>';
  });
  h += '<button class="btn rouge second" style="background:var(--rouge-c);color:var(--rouge)" onclick="fermerModale()">❌ Ce produit n\'est pas dans la commande</button>';
  modale(h);
}
function cleEmpl(e) {
  var m = String(e || '').match(/^([A-Z]+)(\d+)$/);

}
function saisirEmplacement(n) {
  var l = ligneN(n);

    '<label class="lab">Rangée puis hauteur (ex. A5)</label>' +
    '<input type="text" id="empl-saisie" autocapitalize="characters" autocomplete="off" maxlength="6" ' +
    'style="font-size:28px;font-weight:800;text-align:center;letter-spacing:2px" value="' + esc(l.emplacement || '') + '">' +
    '<div id="empl-erreur" class="ecart" style="display:none"></div>' +
    '<button class="btn" onclick="validerEmplacement(' + n + ')">Enregistrer</button>' +

    '<button class="btn second" onclick="fermerModale()">Annuler</button>');

function validerEmplacement(n, retirer) {
  var l = ligneN(n);

  if (!retirer && !/^[A-Z]{1,3}\d{1,3}$/.test(v)) {

  attente(true, 'Enregistrement…');
  appel('mobEmplacement', S.code, l.code, v).then(function (r) {
    attente(false); fermerModale();
    S.cmd.lignes.forEach(function (x) { if (x.code === l.code) x.emplacement = r || ''; });
    if (S.apresEmpl) { var f = S.apresEmpl; S.apresEmpl = null; f(r || ''); } else dessinerLignes();
    toast(r ? '📍 ' + l.libelle.slice(0, 30) + ' : ' + r : 'Emplacement retiré', 'var(--anthracite)');
  }).catch(function (e) { attente(false); toast(e, 'var(--rouge)'); });
}
function signaler(codeArticle, libelle, apres) {
  modale('<h2>⚠ À recommander</h2><p style="margin-top:0">' + esc(libelle) + '</p>' +
    '<p style="color:var(--gris);margin-top:0">Le bureau sera prévenu qu\'il faut en recommander.</p>' +
    '<label class="lab">Remarque (facultatif)</label><input type="text" id="reco-rem" placeholder="ex. plus que 2 boîtes">' +
    '<button class="btn" style="background:var(--orange)" id="reco-ok">Signaler au bureau</button>' +
    '<button class="btn second" onclick="fermerModale()">Annuler</button>');
  $('reco-ok').onclick = function () {
    var rem = $('reco-rem').value.trim();
    attente(true, 'Envoi au bureau…');
    appel('mobSignaler', S.code, codeArticle, libelle, rem).then(function (r) {
      attente(false); fermerModale();
      toast(r && r.deja ? 'Déjà signalé par ' + r.par + ' (' + r.le + ')' : '⚠ Signalé au bureau : à recommander', 'var(--orange)');

function signalerLigne(n) {
  var l = ligneN(n);
  signaler(l.code, l.libelle, function () {
    S.cmd.lignes.forEach(function (x) { if (x.code === l.code) x.signale = true; });
    dessinerLignes();
  });
}

// ---------- onglet Article : scanner une boîte hors commande ----------
function ecranArticle(groupes, onglet) {
  S.ecran = 'article';
  entete('Bonjour ' + (S.nom || '').split(' ')[0] + ' 👋', false);
  var h = '<div class="onglets">' + onglet('prep', '📦 Préparer') + onglet('livr', '🚐 Livrer') + onglet('fait', '✅ Livrées') +
    '<button class="actif">🔎 Article</button></div>' +
    '<p style="margin:0 0 10px;color:var(--gris)">Scannez une boîte pour voir ou changer son emplacement, ou signaler qu\'il faut en recommander.</p>' +
    '<div class="scan"><input type="search" id="saisie-scan" autocomplete="off" placeholder="Scanner ou taper un code" enterkeyhint="go">' +
    '<button onclick="ouvrirCamera()" aria-label="Caméra">📷</button></div><div id="fiche-article"></div>';
  $('ecran').innerHTML = h;
  var champ = $('saisie-scan');
  champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); chercherArticle(champ.value); champ.value = ''; } });
  if (S.article) afficherArticle(S.article);
  barreBas('');
}
function chercherArticle(brut) {
  brut = String(brut || '').trim();
  if (!brut) return;
  arreterCamera();
  attente(true, 'Recherche de l\'article…');
  appel('mobChercherArticle', S.code, brut).then(function (a) {
    attente(false);
    if (!a) {
      bip(false); S.article = null;
      $('fiche-article').innerHTML = '<div class="ecart">Article inconnu pour « ' + esc(brut) + ' ». Il sera reconnu après ' +
        'son premier passage dans une commande (scannez alors sa boîte pour enregistrer le code-barres).</div>';
      return;
    }
    bip(true); S.article = a; afficherArticle(a);
  }).catch(function (e) { attente(false); toast(e, 'var(--rouge)'); });
}
function afficherArticle(a) {
  $('fiche-article').innerHTML = '<div class="ligne"><div class="haut-ligne">' +
    '<span class="empl' + (a.emplacement ? '' : ' vide-empl') + '" onclick="emplacementArticle()">📍 ' +
    (a.emplacement ? esc(a.emplacement) : 'Ajouter l\'emplacement') + '</span><div class="lib">' + esc(a.libelle || a.code) +
    '</div></div><div class="ref">Réf. ' + esc(a.code) + '</div>' +
    '<button class="btn noir" onclick="emplacementArticle()">📍 ' + (a.emplacement ? 'Changer l\'emplacement' : 'Indiquer l\'emplacement') + '</button>' +
    (a.signale ? '<div class="signale">⚠ Déjà signalé : à recommander</div>' :
      '<button class="signaler" onclick="signaler(S.article.code, S.article.libelle || S.article.code, function(){S.article.signale=true;afficherArticle(S.article);})">' +
      '⚠ Il n\'en reste presque plus : à recommander</button>') + '</div>';
}
function emplacementArticle() {
  var a = S.article;
  S.cmd = { lignes: [{ ligne: 0, code: a.code, libelle: a.libelle || a.code, emplacement: a.emplacement }] };
  S.apresEmpl = function (e) { a.emplacement = e; S.cmd = null; afficherArticle(a); };
  saisirEmplacement(0);
}
function ligneN(n) { return S.cmd.lignes.filter(function (x) { return x.ligne === n; })[0]; }
function associer(n, brut, deplacer) {
  var l = ligneN(n);
  fermerModale();
  attente(true, 'Enregistrement du code-barres…');
  appel('mobApprendre', S.code, l.code, brut, !!deplacer).then(function (r) {
    attente(false);
    if (r && r.ok === false && r.autre) {
      modale('<h2>Code déjà utilisé</h2><p style="margin-top:0">Le code-barres <b>' + esc(brut) + '</b> est enregistré pour ' +
        'l\'article <b>' + esc(r.autre) + '</b>.</p><p>Est-ce une erreur ? Il sera alors rattaché à :<br><b>' + esc(l.libelle) + '</b></p>' +
        '<button class="btn" onclick="associer(' + n + ',\'' + esc(brut).replace(/'/g, '') + '\', true)">Oui, le déplacer vers cet article</button>' +
        '<button class="btn second" onclick="fermerModale()">Non, laisser comme avant</button>');
      return;
    }
    if (l.eans.indexOf(brut) < 0) l.eans.push(brut);
    l.appris = l.appris || [];
    if (l.appris.indexOf(brut) < 0) l.appris.push(brut);
    toast('📷 Code-barres enregistré pour ' + l.libelle.slice(0, 36) + ' : il sera reconnu partout', 'var(--rose)');
    scanne(brut);
  }).catch(function (e) { attente(false); toast('Code non enregistré : ' + e, 'var(--rouge)'); });
}
function confirmerDeplacement() {
  var d = S.deplacement, ancien = ligneN(d.de);
  ancien.eans = ancien.eans.filter(function (x) { return x !== d.code; });
  ancien.appris = (ancien.appris || []).filter(function (x) { return x !== d.code; });
  dessinerLignes();
  associer(d.vers, d.code, true);
}
function gererCodes(n) {
  var l = ligneN(n), appris = l.appris || [];
  var h = '<h2>Codes-barres de l\'article</h2><p style="margin-top:0;color:var(--gris)">' + esc(l.libelle) + '</p>';
  l.eans.forEach(function (c) {
    var modifiable = appris.indexOf(c) >= 0;
    h += '<div class="code-ligne"><div class="num">' + esc(c) + '<div class="src">' +
      (modifiable ? 'scanné au téléphone' : 'fiche article (Extrabat / fournisseur)') + '</div></div>' +
      (modifiable ? '<button onclick="oublierCode(' + n + ',\'' + esc(c).replace(/'/g, '') + '\')">🗑️ Supprimer</button>' : '') + '</div>';
  });
  h += '<button class="btn" onclick="fermerModale();apprendreLigne(' + n + ')">📷 Scanner le bon code-barres</button>' +
    '<p style="font-size:13px;color:var(--gris)">Un code de la fiche article ne se supprime pas ici : s\'il est faux, corrigez-le dans Extrabat.</p>' +
    '<button class="btn second" onclick="fermerModale()">Fermer</button>';
  modale(h);
}
function oublierCode(n, c) {
  var l = ligneN(n);
  attente(true, 'Suppression…');
  appel('mobOublier', S.code, l.code, c).then(function () {
    attente(false);
    l.eans = l.eans.filter(function (x) { return x !== c; });
    l.appris = (l.appris || []).filter(function (x) { return x !== c; });
    dessinerLignes();
    toast('🗑️ Code-barres supprimé. Corrigez la quantité avec − si besoin.', 'var(--anthracite)');
    gererCodes(n);
  }).catch(function (e) { attente(false); toast(e, 'var(--rouge)'); });
}
function modale(html) { $('modale-boite').innerHTML = html; $('modale').style.display = 'flex'; }
function fermerModale() { $('modale').style.display = 'none'; var c = $('saisie-scan'); if (c) c.focus(); }

// ---------- caméra ----------
var flux = null, lecteur = null, boucle = null, dernier = { code: '', t: 0 };
function resultatCamera(texte) {
  var t = Date.now();
  if (texte === dernier.code && t - dernier.t < 1800) return;   // même boîte vue deux fois de suite
  dernier = { code: texte, t: t };
  scanne(texte);
}
function ouvrirCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('photo-code').click(); return; }
  $('video-zone').style.display = 'block';
  var video = $('video');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) {
    flux = s; video.srcObject = s; return video.play();
  }).then(function () {
    if ('BarcodeDetector' in window) {
      var det = new BarcodeDetector();
      var tick = function () {
        if (!flux) return;
        det.detect(video).then(function (codes) { if (codes.length) resultatCamera(codes[0].rawValue); })
          .catch(function () {}).then(function () { boucle = setTimeout(tick, 180); });
      };
      tick();
    } else if (window.ZXing) {
      lecteur = new ZXing.BrowserMultiFormatReader();
      var rappel = function (r) { if (r) resultatCamera(r.getText()); };
      if (typeof lecteur.decodeFromVideoElementContinuously === 'function') {
        lecteur.decodeFromVideoElementContinuously(video, rappel);
      } else {   // anciennes versions de la bibliothèque : elle ouvre elle-même la caméra
        flux.getTracks().forEach(function (t) { t.stop(); });
        lecteur.decodeFromVideoDevice(null, video, rappel);
      }
    } else { throw new Error('lecteur indisponible'); }
  }).catch(function () {
    arreterCamera();
    toast('Caméra en direct indisponible : prenez une photo du code-barres', 'var(--anthracite)');
    $('photo-code').click();
  });
}
function arreterCamera() {
  clearTimeout(boucle);
  if (lecteur) { try { lecteur.reset(); } catch (e) {} lecteur = null; }
  if (flux) { flux.getTracks().forEach(function (t) { t.stop(); }); flux = null; }
  $('video-zone').style.display = 'none';
  var c = $('saisie-scan'); if (c) c.focus();
}
$('photo-code').addEventListener('change', function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  attente(true, 'Lecture du code-barres…');
  var url = URL.createObjectURL(f);
  var fin = function (txt) { attente(false); URL.revokeObjectURL(url); if (txt) scanne(txt); else { bip(false); toast('Code-barres illisible : réessayez de plus près, ou cochez à la main', 'var(--rouge)'); } };
  if ('BarcodeDetector' in window) {
    createImageBitmap(f).then(function (img) { return new BarcodeDetector().detect(img); })
      .then(function (c) { fin(c.length ? c[0].rawValue : ''); }).catch(function () { fin(''); });
  } else if (window.ZXing) {
    new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url).then(function (r) { fin(r.getText()); }).catch(function () { fin(''); });
  } else { fin(''); }
});

// ---------- fin de préparation / livraison ----------
function ecarts() {
  return S.cmd.lignes.filter(function (l) { return (S.q[l.ligne] || 0) !== cibleLigne(l); });
}
function listeEcarts(e) {
  return '<div class="ecart">' + e.map(function (l) {
    return '<div style="margin:3px 0">• ' + esc(l.libelle.slice(0, 60)) + ' : <b>' + (S.q[l.ligne] || 0) + ' / ' + cibleLigne(l) + '</b></div>';
  }).join('') + '</div>';
}
function terminer() {
  var e = ecarts();
  if (S.mode === 'prep') {
    var h = '<h2>' + (e.length ? '⚠ Préparation incomplète' : '✅ Tout est prêt') + '</h2>';
    if (e.length) h += '<p style="margin-top:0">Ces lignes ne correspondent pas à la commande :</p>' + listeEcarts(e) +
      '<label class="lab">Pourquoi ? (rupture, remplacement…)</label><textarea id="remarque" rows="2"></textarea>';
    else h += '<p style="margin-top:0;color:var(--gris)">La commande passe dans « À livrer ».</p>';
    h += '<button class="btn ' + (e.length ? 'noir' : 'vert') + '" onclick="validerPrep()">' + (e.length ? 'Valider quand même' : 'Valider la préparation') + '</button>' +
      '<button class="btn second" onclick="fermerModale()">Continuer à préparer</button>';
    modale(h);
  } else {
    if (e.length) {
      modale('<h2>⚠ Il manque quelque chose</h2><p style="margin-top:0">Vérifiez avec le praticien :</p>' + listeEcarts(e) +
        '<button class="btn noir" onclick="fermerModale();ecranSignature()">Continuer vers la signature</button>' +
        '<button class="btn second" onclick="fermerModale()">Revérifier</button>');
    } else { ecranSignature(); }
  }
}
function validerPrep() {
  var rem = $('remarque') ? $('remarque').value.trim() : '';
  attente(true, 'Enregistrement…');
  appel('mobPreparation', S.code, S.cmd.id, S.q, rem).then(function () {
    attente(false); fermerModale(); effacer('ad_q_' + S.cmd.id + '_prep');
    toast('✅ Commande N°' + S.cmd.id + ' prête à livrer', 'var(--vert)');
    S.onglet = 'livr'; chargerListe();
  }).catch(function (err) { attente(false); toast(err, 'var(--rouge)'); });
}

// ---------- signature et photo ----------
var sig = { trace: false, vide: true };
function ecranSignature() {
  S.ecran = 'signature';
  entete('N°' + S.cmd.id + ' · signature', true);
  var e = ecarts();
  $('ecran').innerHTML =
    '<div class="etapes"><div class="fait"><span></span>Préparer</div><div class="fait"><span></span>Vérifier chez le client</div>' +
    '<div class="encours"><span></span>Signature</div></div>' +
    '<div class="carte"><label class="lab">Réceptionné par</label><input type="text" id="signataire" placeholder="Nom du praticien ou de l\'assistante" value="' + esc(S.cmd.praticien) + '">' +
    '<label class="lab" style="margin-top:14px">Signature</label><canvas id="signature"></canvas>' +
    '<div class="rangee" style="margin-top:8px"><button class="btn second" onclick="effacerSignature()">Effacer</button></div></div>' +
    '<div class="carte"><label class="lab">Photo des colis livrés</label>' +
    '<button class="btn noir" onclick="$(\'photo-colis\').click()">📸 Prendre la photo</button><img id="apercu" class="apercu">' +
    (e.length ? '<label class="lab" style="margin-top:14px">Écarts constatés</label>' + listeEcarts(e) : '') +
    '<label class="lab" style="margin-top:14px">Remarque (facultatif)</label><textarea id="remarque-livr" rows="2"></textarea></div>';
  initSignature();
  if (S.photo) { $('apercu').src = S.photo; $('apercu').style.display = 'block'; }
  barreBas('<button class="btn vert" onclick="validerLivraison()">✅ Valider la livraison</button>');
}
function initSignature() {
  var c = $('signature'), r = window.devicePixelRatio || 1;
  c.width = c.clientWidth * r; c.height = c.clientHeight * r;
  var x = c.getContext('2d'); x.scale(r, r); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#1A1A1A';
  sig.vide = true;
  var pos = function (e) { var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = function (e) { sig.trace = true; sig.vide = false; c.setPointerCapture(e.pointerId); var p = pos(e); x.beginPath(); x.moveTo(p.x, p.y); };
  c.onpointermove = function (e) { if (!sig.trace) return; var p = pos(e); x.lineTo(p.x, p.y); x.stroke(); };
  c.onpointerup = c.onpointercancel = function () { sig.trace = false; };
}
function effacerSignature() { var c = $('signature'); c.getContext('2d').clearRect(0, 0, c.width, c.height); sig.vide = true; }
$('photo-colis').addEventListener('change', function (e) {
  var f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var m = 1280, k = Math.min(1, m / Math.max(img.width, img.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    S.photo = cv.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
    $('apercu').src = S.photo; $('apercu').style.display = 'block';
  };
  img.src = url;
});
function signatureBlanche() {
  var c = $('signature'), cv = document.createElement('canvas');
  cv.width = c.width; cv.height = c.height;
  var x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(c, 0, 0);
  return cv.toDataURL('image/png');
}
function validerLivraison() {
  var nom = $('signataire').value.trim();
  if (!nom) { toast('Indiquez qui réceptionne la commande', 'var(--rouge)'); return; }
  if (sig.vide) { toast('La signature est obligatoire', 'var(--rouge)'); return; }
  if (!S.photo && !confirm('Pas de photo des colis. Valider quand même ?')) return;
  attente(true, 'Enregistrement de la livraison et du bon PDF…');
  appel('mobLivraison', S.code, S.cmd.id, S.q, nom, signatureBlanche(), S.photo || '', $('remarque-livr').value.trim())
    .then(function (r) {
      attente(false); effacer('ad_q_' + S.cmd.id + '_livr'); S.photo = '';
      S.onglet = 'fait';
      $('ecran').innerHTML = '<div class="vide"><div class="gros">🎉</div><h2 style="color:var(--noir)">Livraison enregistrée</h2>' +
        '<p>Le bon de livraison signé est enregistré' + (r.ecarts ? ' avec ' + r.ecarts + ' écart' + (r.ecarts > 1 ? 's' : '') : '') + '.</p>' +
        '<a class="btn noir" style="text-decoration:none" href="' + esc(r.bon) + '" target="_blank">📄 Voir le bon de livraison</a></div>';
      entete('Livraison terminée', false);
      barreBas('<button class="btn" onclick="chargerListe()">Retour aux commandes</button>');
    }).catch(function (err) { attente(false); toast(err, 'var(--rouge)'); });
}

// ======================================================================
// Navigation
// ======================================================================
function retour() {
  if (S.ecran === 'signature') { ecranCommande(); return; }
  chargerListe();
}
(function demarrer() {
  S.code = lire('ad_code', ''); S.nom = lire('ad_nom', '');
  if (S.code) chargerListe(); else ecranConnexion();
})();
</script>
</body>
</html>
